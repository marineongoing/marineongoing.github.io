.kicker{margin-top:28px;font-size:13px;color:var(--soft);letter-spacing:.02em}
.title{margin:4px 0 0;font-size:40px;font-weight:300;letter-spacing:-.01em;line-height:1.05}
.date{margin-top:8px;font-size:14px;color:var(--soft)}
.chips{display:flex;gap:8px;margin-top:22px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;white-space:nowrap}
.chip i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.chip svg{width:14px;height:14px}
.foot{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;color:var(--soft)}
.foot svg{width:15px;height:15px}
footer{text-align:center;font-size:13px;color:var(--soft);letter-spacing:.02em}
@media (max-width:820px){
  .page{padding:16px 22px 22px}
  main{padding:10px 0}
  .cards{flex-direction:column;gap:30px;width:100%;max-width:300px}
  .pill{width:100%;height:84px;padding:0;border-radius:26px;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.22)}
  .pill .lens,.pill .kicker,.pill .chips,.pill .foot{display:none}
  .pill .title{margin:0;font-size:24px;font-weight:200;letter-spacing:.14em;text-transform:lowercase}
  .bg{background-image:var(--bgm,var(--bgs));background-position:center 62%}
}
.dots{display:none;justify-content:center;gap:6px;margin-top:4px}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,width .3s}
.dots span.on{background:#fff;width:16px;border-radius:3px}

/* Version site : blocs simples comme sur mobile */
.pill .lens,.pill .kicker,.pill .chips,.pill .foot{display:none!important}
@media (min-width:821px){.pill{width:240px;height:96px;padding:0;border-radius:26px;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.22)}
.pill .title{margin:0;font-size:26px;font-weight:200;letter-spacing:.14em;text-transform:lowercase}
.cards{gap:36px}}

.lifeflower{display:none}
@media (min-width:821px){
  .pill{overflow:visible!important}
  .lifeflower{display:block;position:absolute;left:50%;top:-78px;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .lifeflower img{width:100%;height:100%;object-fit:cover;display:block}
}
@media (min-width:821px){.studyflower{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.studyflower img{object-fit:contain!important;padding:6px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}}

/* Version site : façon écran de verrouillage du Mac */
@media (min-width:821px){
  .cards{gap:70px!important;align-items:flex-start}
  .pill{width:140px!important;height:auto!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;display:flex;flex-direction:column;align-items:center;gap:14px}
  .pill:hover .lifeflower,.pill:focus-visible .lifeflower{transform:scale(1.06)}
  .lifeflower{position:static!important;transform:none;width:96px!important;height:96px!important;transition:transform .25s ease;box-shadow:0 10px 26px rgba(0,0,0,.35)}
  .workicon{display:grid!important;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .workicon svg{width:40px;height:40px}
  .studyflower img{padding:12px!important}
  .pill .title{font-size:17px!important;font-weight:300!important;letter-spacing:.06em!important;text-shadow:0 1px 4px rgba(0,0,0,.45)}
}

/* Réglages de la page de lancement */
.hleft{display:flex;align-items:center;gap:12px}
.gear{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.gear svg{width:18px;height:18px}
.gear:hover{background:rgba(255,255,255,.22)}
dialog.sett{border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:24px;width:min(560px,94vw);max-height:88vh;color:#fff;background:linear-gradient(180deg,rgba(60,52,46,.86),rgba(38,33,30,.9));-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);font:300 15px/1.4 "Sora",system-ui,sans-serif}
dialog.sett::backdrop{background:rgba(10,8,6,.35)}
.sett h2{font-weight:300;font-size:24px;margin:0 0 4px}
.sett h3{font-weight:400;font-size:15px;margin:20px 0 10px}
.sett .hint{color:rgba(255,255,255,.6);font-size:13px;margin:0}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opt{width:52px;height:52px;border-radius:50%;padding:0;border:2px solid transparent;background:rgba(255,255,255,.1);cursor:pointer;overflow:hidden;display:grid;place-items:center;color:#fff}
.opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt.contain img{object-fit:contain;padding:7px}
.opt svg{width:24px;height:24px}
.opt[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.bgopt{width:96px;height:60px;border-radius:14px;background-size:cover;background-position:center}
.upl{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:12px;border:1px dashed rgba(255,255,255,.4);color:#fff;font-size:13px;cursor:pointer}
.upl input{display:none}
.sett .foot{display:flex;justify-content:space-between;margin-top:22px}
.sett .btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 16px;font:inherit;cursor:pointer}
.sett .btn.dark{background:rgba(255,255,255,.92);color:#1B1B1D;border-color:transparent}

.rng{width:100%;accent-color:#fff}
.cwrap{display:flex;justify-content:center;margin:16px 0 4px}
.cv{max-width:100%;height:auto!important;border-radius:16px;touch-action:none;cursor:grab;background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.cv:active{cursor:grabbing}
.cv.round{border-radius:50%}
</style>

<script>
(function(){
  const mq=matchMedia("(max-width:820px)");
  function align(){
    const m=mq.matches,IW=m?900:1600,IH=m?1200:767,py=m?.62:.4;
    const vw=innerWidth,vh=innerHeight,ir=IW/IH;let w,h;
    if(vw/vh>ir){w=vw;h=vw/ir}else{h=vh;w=vh*ir}
    const ox=(vw-w)/2,oy=(vh-h)*py;
    document.querySelectorAll(".lens").forEach(l=>{const r=l.getBoundingClientRect();l.style.backgroundSize=w+"px "+h+"px";l.style.backgroundPosition=(ox-r.left)+"px "+(oy-r.top)+"px"});
  }
  const cards=document.getElementById("cards"),dots=[...document.querySelectorAll("#dots span")];
  let raf=0;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{align();const pills=[...cards.children],c=cards.scrollLeft+cards.clientWidth/2;let best=0,bd=1e9;pills.forEach((p,i)=>{const m=p.offsetLeft+p.offsetWidth/2,dd=Math.abs(m-c);if(dd<bd){bd=dd;best=i}});dots.forEach((d,i)=>d.classList.toggle("on",i===best))})};
  addEventListener("resize",sched);addEventListener("scroll",sched,{passive:true});cards.addEventListener("scroll",sched,{passive:true});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
  const tick=()=>{const n=new Date(),dd=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}).replace(/ 1 /," 1er ");
    document.getElementById("clock").textContent=dd.charAt(0).toUpperCase()+dd.slice(1);
    const hr=n.getHours();document.getElementById("hello").textContent=(hr<5||hr>=18?"Bonsoir":"Bonjour")+", Marine";};
  tick();setInterval(tick,15000);align();setTimeout(sched,200);
})();

  const DEF={work:"brief",life:"hibiscus",study:"lys",bg:"default"};
  const CATS=[["work","Work"],["life","Life"],["study","Study"]];
  const BGS=[["default","Par défaut","var(--bgp)"],["palms","Palmiers","var(--bgp)"],["sunset","Coucher de soleil","var(--bgs)"]];
  const KEY="mog-launcher";
  let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  const get=k=>st[k]||DEF[k];
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){alertBox("Image trop lourde pour être gardée sur cet appareil.")}};
  const iconHTML=v=>{if(v&&v.startsWith("data:"))return {html:`<img src="${v}" alt="">`,contain:false,glass:false};const i=ICONS[v]||ICONS.brief;return i.img?{html:`<img src="${i.img}" alt="">`,contain:!!i.contain,glass:!!i.contain}:{html:i.svg,contain:false,glass:true}};
  function apply(){
    CATS.forEach(([c])=>{const el=document.querySelector(`.lifeflower[data-cat="${c}"]`);if(!el)return;const r=iconHTML(get(c));el.innerHTML=r.html;el.classList.toggle("workicon",r.glass&&!r.contain);el.classList.toggle("studyflower",r.contain);el.style.display=""});
    const b=get("bg"),root=document.documentElement.style;
    if(b==="default"){root.removeProperty("--bgd");root.removeProperty("--bgm")}
    else if(b==="palms"){root.setProperty("--bgd","var(--bgp)");root.setProperty("--bgm","var(--bgp)")}
    else if(b==="sunset"){root.setProperty("--bgd","var(--bgs)");root.setProperty("--bgm","var(--bgs)")}
    else if(b.startsWith("data:")){root.setProperty("--bgd",`url("${b}")`);root.setProperty("--bgm",`url("${b}")`)}
    const bl=+(st.blur||0),bgEl=document.querySelector(".bg");
    if(bgEl){bgEl.style.filter=bl?`blur(${bl}px)`:"";bgEl.style.transform=bl?`scale(${1+bl/120})`:""}
  }
  function resize(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=fr.result};fr.readAsDataURL(file)})}
  function square(file,size){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);res(c.toDataURL("image/jpeg",.85))};im.src=fr.result};fr.readAsDataURL(file)})}
  const dlg=document.getElementById("sett");
  function alertBox(t){const p=dlg.querySelector(".hint.err");if(p)p.textContent=t}
  function draw(){
    const opt=(c,v)=>{const r=iconHTML(v),cur=get(c);return `<button class="opt${r.contain?" contain":""}" data-cat="${c}" data-v="${v}" aria-pressed="${cur===v}" title="${(ICONS[v]||{}).n||"Ma photo"}">${r.html}</button>`};
    dlg.innerHTML=`<h2>Réglages</h2><p class="hint">Ces choix sont gardés sur cet appareil.</p>
      ${CATS.map(([c,l])=>`<h3>Icône ${l}</h3><div class="opts">${Object.keys(ICONS).map(v=>opt(c,v)).join("")}${get(c).startsWith("data:")?opt(c,get(c)):""}<label class="upl">Importer une image<input type="file" accept="image/*" data-up="${c}"></label></div>`).join("")}
      <h3>Fond</h3><div class="opts">${BGS.map(([v,l,css])=>`<button class="opt bgopt" data-cat="bg" data-v="${v}" aria-pressed="${get("bg")===v}" title="${l}" style="background-image:${v==="default"?"linear-gradient(90deg,transparent 50%,rgba(0,0,0,0) 50%),var(--bgp)":css}"></button>`).join("")}${get("bg").startsWith("data:")?`<button class="opt bgopt" data-cat="bg" data-v="${get("bg")}" aria-pressed="true" title="Ma photo" style="background-image:url('${get("bg")}')"></button>`:""}<label class="upl">Importer une photo<input type="file" accept="image/*" data-up="bg"></label></div>
      <p class="hint" style="margin-top:8px">« Par défaut » : palmiers sur ordinateur, coucher de soleil sur téléphone.</p>
      <h3>Flou du fond <span class="hint" id="blurVal" style="display:inline">${st.blur||0} px</span></h3><input type="range" class="rng" min="0" max="30" step="1" value="${st.blur||0}" data-blur aria-label="Flou du fond">
      <p class="hint err" style="color:#FFC2B8;margin-top:8px"></p>
      <div class="foot"><button class="btn" data-reset>Réinitialiser</button><button class="btn dark" data-close>Fermer</button></div>`;
  }
  document.getElementById("gearBtn").addEventListener("click",()=>{draw();dlg.showModal()});
  dlg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-close")){dlg.close();return}
    if(b.hasAttribute("data-ccancel")){crop=null;draw();return}
    if(b.hasAttribute("data-cok")){st[crop.cat]=exportCrop();crop=null;save();apply();draw();return}
    if(b.hasAttribute("data-reset")){st={};save();apply();draw();return}
    if(b.dataset.cat){st[b.dataset.cat]=b.dataset.v;save();apply();draw()}});
  dlg.addEventListener("input",e=>{const r=e.target;if(r.hasAttribute("data-blur")){st.blur=+r.value;const v=document.getElementById("blurVal");if(v)v.textContent=r.value+" px";apply()}
    else if(r.hasAttribute("data-zoom")&&crop){const cx=crop.FW/2,cy=crop.FH/2,old=crop.s;crop.zoom=+r.value;const ns=crop.s0*crop.zoom;crop.x=cx-(cx-crop.x)*ns/old;crop.y=cy-(cy-crop.y)*ns/old;crop.s=ns;clampC();paint()}});
  dlg.addEventListener("change",e=>{const r=e.target;if(r.hasAttribute("data-blur")){save();return}
    if(!r.dataset.up||!r.files[0])return;const c=r.dataset.up,fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>openCrop(c,im);im.onerror=()=>alertBox("Cette image n'a pas pu être lue.");im.src=fr.result};fr.onerror=()=>alertBox("Cette image n'a pas pu être lue.");fr.readAsDataURL(r.files[0])});
  /* ---------- Recadrage ---------- */
  let crop=null;
  function openCrop(cat,im){
    const isBg=cat==="bg",FW=isBg?440:280,FH=isBg?275:280;
    const s0=Math.max(FW/im.width,FH/im.height);
    crop={cat,im,FW,FH,s0,zoom:1,s:s0,x:(FW-im.width*s0)/2,y:(FH-im.height*s0)/2};
    dlg.innerHTML=`<h2>Recadrer</h2><p class="hint">Fais glisser l'image pour la placer, et zoome avec le curseur.</p>
      <div class="cwrap"><canvas id="cv" width="${FW*2}" height="${FH*2}" class="cv${isBg?"":" round"}" style="width:${FW}px;height:${FH}px"></canvas></div>
      <h3>Zoom</h3><input type="range" class="rng" min="1" max="4" step="0.01" value="1" data-zoom aria-label="Zoom">
      <div class="foot"><button class="btn" data-ccancel>Annuler</button><button class="btn dark" data-cok>Valider</button></div>`;
    const cv=document.getElementById("cv");let drag=null;
    cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,ox:crop.x,oy:crop.y};cv.setPointerCapture(e.pointerId)});
    cv.addEventListener("pointermove",e=>{if(!drag)return;const r=cv.getBoundingClientRect(),k=crop.FW/r.width;crop.x=drag.ox+(e.clientX-drag.x)*k;crop.y=drag.oy+(e.clientY-drag.y)*k;clampC();paint()});
    const end=()=>drag=null;cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
    cv.addEventListener("wheel",e=>{e.preventDefault();const z=document.querySelector("[data-zoom]");z.value=Math.max(1,Math.min(4,+z.value-e.deltaY*0.002));z.dispatchEvent(new Event("input",{bubbles:true}))},{passive:false});
    paint();
  }
  function clampC(){const dw=crop.im.width*crop.s,dh=crop.im.height*crop.s;crop.x=Math.min(0,Math.max(crop.FW-dw,crop.x));crop.y=Math.min(0,Math.max(crop.FH-dh,crop.y))}
  function paint(){const cv=document.getElementById("cv");if(!cv)return;const g=cv.getContext("2d"),k=2;g.clearRect(0,0,cv.width,cv.height);g.drawImage(crop.im,crop.x*k,crop.y*k,crop.im.width*crop.s*k,crop.im.height*crop.s*k)}
  function exportCrop(){const isBg=crop.cat==="bg",OW=isBg?1600:256,OH=isBg?1000:256,k=OW/crop.FW,c=document.createElement("canvas");c.width=OW;c.height=OH;
    c.getContext("2d").drawImage(crop.im,crop.x*k,crop.y*k,crop.im.width*crop.s*k,crop.im.height*crop.s*k);return c.toDataURL("image/jpeg",isBg?.74:.86)}
  apply();
})();


</script>
</body>
</html>
