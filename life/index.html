  else if(a==="jclean")journalClean();
  else if(a==="jreco")journalRecos();
  else if(a==="jundo"){const x=D(S.day);if(x.journalRaw){patch(S.day,{journal:x.journalRaw,journalRaw:null});render()}}
  else if(a==="jday"){S.day=b.dataset.d;render();window.scrollTo({top:0})}
  else if(a==="goday"){S.day=b.dataset.d;render();window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="hbday"){S.hbday=b.dataset.d;render()}
  else if(a==="hbprev"){S.hbmonth=shiftMonth(S.hbmonth,-1);render()}
  else if(a==="hbnext"){S.hbmonth=shiftMonth(S.hbmonth,1);render()}
  else if(a==="hbcheck"){const day=S.hbday&&S.hbday<=today()?S.hbday:today(),l=[...(D(day).habits||[])],i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);patch(day,{habits:l});render()}
  else if(a==="hbpreset"){saveItem(uid(),{kind:"habit",...HPRESETS[+v],from:today()});render()}
  else if(a==="hmprev"){S.hmonth=shiftMonth(S.hmonth,-1);render()}
  else if(a==="hmnext"){S.hmonth=shiftMonth(S.hmonth,1);render()}
  else if(a==="addtodo")addTodo();
  else if(a==="wkprev"){S.wk=addDays(S.wk||mondayOf(today()),-7);S.wkSel=null;render()}
  else if(a==="wknext"){S.wk=addDays(S.wk||mondayOf(today()),7);S.wkSel=null;render()}
  else if(a==="wktoday"){S.wk=null;S.wkSel=null;render()}
  else if(a==="wksel"){S.wkSel=b.dataset.d;render()}
  else if(a==="wkcheck"){const k=b.dataset.kind;if(k==="todo"){const x=S.items[id];saveItem(id,{...x,done:!x.done})}else if(k==="step"){const g=S.items[id];saveItem(id,{...g,steps:(g.steps||[]).map(st=>st.id===b.dataset.sid?{...st,done:!st.done,doneOn:!st.done?today():null}:st)})}render()}
  else if(a==="todoadd"){S.todoAdd=!S.todoAdd;render();if(S.todoAdd)setTimeout(()=>{const i=$("#todoIn");if(i)i.focus()},30)}
  else if(a==="todoedit"){S.todoEdit=!S.todoEdit;render()}
  else if(a==="tcheck"){const k=b.dataset.kind,t=today();
    if(k==="todo"){const x=S.items[id];saveItem(id,{...x,done:!x.done,date:x.done?x.date:t})}
    else if(k==="step"){const g=S.items[id];saveItem(id,{...g,steps:(g.steps||[]).map(s=>s.id===b.dataset.sid?{...s,done:!s.done,doneOn:!s.done?t:null}:s)})}
    else{const key=k+":"+id,dx=[...(D(t).doneX||[])],i=dx.indexOf(key);i>=0?dx.splice(i,1):dx.push(key);patch(t,{doneX:dx})}
    render()}

  else if(a==="delstep"){const g=S.items[id];saveItem(id,{...g,steps:(g.steps||[]).filter(s=>s.id!==b.dataset.sid)});render()}
  else if(a==="addstep")addStep(id);

  else if(a==="new")openSheet(b.dataset.kind);

  else if(a==="moodsheet")openPanel("mood");

  else if(a==="ask"){const q=$("#askIn").value.trim();if(q){$("#askIn").value="";askClaude(q)}}
  else if(a==="careerai")careerClaude();
  else if(a==="settings"){S.newKey=null;S.sheet=null;S.panel=null;$("#sheet").innerHTML=settingsHTML();$("#sheet").showModal()}

  else if(a==="copykey")navigator.clipboard.writeText(S.newKey).then(()=>toast("Clé copiée."),()=>toast("Sélectionne la clé et copie-la à la main."));

});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="ravIn"){S.ravEdit=null;render()}else if(e.target.id==="todoIn"||e.target.id==="todoDue")addTodo();else if(e.target.id==="askIn"){const q=e.target.value.trim();if(q){e.target.value="";askClaude(q)}}else if(e.target.id==="sportMin")addSport();else if(e.target.id==="stepIn")addStep(S.goal)});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="journal")patch(el.dataset.day,{journal:el.value});
  else if(el.id==="steps"){patch(el.dataset.day,{steps:el.value===""?null:Math.max(0,Math.round(+el.value)),src:{...(D(el.dataset.day).src||{}),steps:"app"}});const i=el.parentElement.querySelector(".bar i");if(i)i.style.width=Math.min(100,(+el.value||0)/P().steps*100)+"%"}
  else if(el.id==="sleep"){patch(el.dataset.day,{sleep:el.value===""?null:Math.max(0,Math.min(24,+el.value)),src:{...(D(el.dataset.day).src||{}),sleep:"app"}});const i=el.parentElement.querySelector(".bar i");if(i)i.style.width=Math.min(100,(+el.value||0)/P().sleep*100)+"%"}

  else if(el.dataset.pref){const k=el.dataset.pref;if(k==="name"||k==="profile")savePrefs({[k]:el.value.trim()});else if(k==="iud")savePrefs({iud:el.value||null});else if(el.value!==""&&+el.value>0)savePrefs({[k]:+el.value})}
});
document.addEventListener("change",e=>{const el=e.target;if(!el.classList)return;

$("#sheet").addEventListener("close",()=>{S.newKey=null;S.panel=null;$("#sheet").classList.remove("pzsheet");render()});

/* ============ Démarrage ============ */
let started=false;
async function boot(){
  if(started)return;started=true;
  const {data:{session}}=await sb.auth.getSession();S.uid=session.user.id;
  cacheLoad();render();setStatus(navigator.onLine?"Chargement…":"Hors connexion");
  try{await loadAll()}catch(e){setStatus("Hors connexion : données de cet appareil")}
  sb.channel("vie-"+S.uid).on("postgres_changes",{event:"*",schema:"public",table:"vie_days",filter:"user_id=eq."+S.uid},p=>{
    if(p.new&&p.new.day){S.days[p.new.day]={...(p.new.data||{}),...(queue[p.new.day]||{})};cacheSave();render(true)}}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(S.opened!==today()){S.opened=S.day=today();render()}loadAll().catch(()=>{})}else flushQueue()});
  window.addEventListener("online",()=>{flushQueue();loadAll().catch(()=>{})});
}
async function initAuth(){
  if(!sb){document.body.innerHTML='<p style="padding:40px">Impossible de charger l\'app. Vérifie ta connexion puis recharge la page.</p>';return}
  const {data:{session}}=await sb.auth.getSession();
  if(session){$("#login").hidden=true;boot()}else $("#login").hidden=false;
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==="PASSWORD_RECOVERY"){$("#login").hidden=false;$("#lg1").hidden=true;$("#lg2").hidden=false;return}
    if(sess&&!started){$("#login").hidden=true;boot()}
    if(ev==="SIGNED_OUT"){try{localStorage.removeItem(CACHE)}catch(e){}location.reload()}});
  const err=t=>$("#lgErr").textContent=t;
  const fr=m=>/Invalid login/i.test(m)?"Adresse ou mot de passe incorrect.":/Email not confirmed/i.test(m)?"Confirme d'abord ton adresse avec le lien reçu par e-mail.":/least 6/i.test(m)?"Le mot de passe doit faire au moins 6 caractères.":m;
  $("#lgIn").onclick=async()=>{const email=$("#lgEmail").value.trim(),password=$("#lgPass").value;if(!email||!password){err("Indique ton adresse et ton mot de passe.");return}err("Connexion…");const {error}=await sb.auth.signInWithPassword({email,password});err(error?fr(error.message):"")};
  $("#lgPass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#lgIn").click()});
  $("#lgForgot").onclick=async()=>{const e=$("#lgEmail").value.trim();if(!e){err("Indique d'abord ton adresse e-mail.");return}const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});err(error?fr(error.message):"Un e-mail t'a été envoyé : ouvre le lien pour choisir un nouveau mot de passe.")};
  $("#lgSave").onclick=async()=>{const pw=$("#lgNew").value;if(pw.length<6){err("6 caractères minimum.");return}const {error}=await sb.auth.updateUser({password:pw});if(error){err(fr(error.message));return}$("#lg2").hidden=true;$("#lg1").hidden=false;$("#login").hidden=true;err("");toast("Mot de passe modifié.");boot()};
}
initAuth();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}))}
