<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="theme-color" content="#3B3530">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#17171B; --muted:#6F6E78; --faint:#A3A1AB; --line:rgba(23,23,27,.08);
  --a1:#FFB38A; --a2:#FF9CC7; --a3:#B9A8FF;
  --glass:linear-gradient(160deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.34) 42%,rgba(255,255,255,.22) 100%);
  --glass-strong:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.58));
  --edge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.45),inset -1px 0 0 rgba(255,255,255,.2);
  --lift:0 18px 44px -22px rgba(70,50,90,.28);
  --blur:blur(26px) saturate(180%);
  --r-xl:28px; --r-l:22px; --r-m:14px; --r-s:10px;
  --dot:"Doto","Outfit",ui-monospace,monospace;
  --orange:#FFC08F; --pink:#FFA5AE; --blue:#ABB2F0; --violet:#BDB0EE; --mint:#A8C3D1; --lime:#FFDDBE;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="dark"]){--ink:#17171B}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#F4F2F0;overflow-x:clip}
body{margin:0;background:transparent;color:var(--ink);font:300 16px/1.55 "Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px);-webkit-font-smoothing:antialiased;overflow-x:clip}
/* Aura de fond : la couleur suit ton humeur */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#F4F2F0;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.85;transition:background 1.4s ease}
#bg i:nth-child(1){width:70vmax;height:70vmax;left:-18vmax;top:-22vmax;background:var(--a1);animation:bgA 26s ease-in-out infinite}
#bg i:nth-child(2){width:60vmax;height:60vmax;right:-20vmax;top:10vmax;background:var(--a2);animation:bgB 31s ease-in-out infinite}
#bg i:nth-child(3){width:55vmax;height:55vmax;left:10vmax;bottom:-30vmax;background:var(--a3);opacity:.6;animation:bgA 37s ease-in-out infinite reverse}
@keyframes bgA{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,5vmax)}}
@keyframes bgB{0%,100%{transform:translate(0,0)}50%{transform:translate(-7vmax,-4vmax)}}
@media (prefers-reduced-motion:reduce){#bg i{animation:none}}
h1,h2,h3{font-weight:300;letter-spacing:-.03em;margin:0;line-height:1.08}
b,strong{font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:18px 20px 30px}
.muted{color:var(--muted)}
.dotnum{font-family:var(--dot);font-weight:600;letter-spacing:.01em;line-height:.95}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}

/* Verre liquide */
.card,.kpi,.wp,.gcard,.moodcard,.goalcard,.datepill,.dock,dialog.sheet,.login .card{
  background:var(--glass);border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),var(--lift)}
.card{border-radius:var(--r-xl);padding:22px 24px;position:relative}
.card h2{font-size:19px;font-weight:400;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;letter-spacing:-.02em}
.card h2 small{font-size:14px;color:var(--muted);font-weight:300;letter-spacing:0}
.card h2 .btn{font-size:14px;padding:7px 12px}

/* Boutons, puces */
.ib{width:40px;height:40px;border-radius:var(--r-m);border:1px solid rgba(255,255,255,.6);background:var(--glass-strong);box-shadow:var(--edge);display:grid;place-items:center;flex:none;color:var(--ink);padding:0;font-weight:500}
.ib svg{width:18px;height:18px}
.ib.dark{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
.ib.sm{width:32px;height:32px;border-radius:var(--r-s)}.ib.sm svg{width:15px;height:15px}
.ib.bare{background:none;border:0;box-shadow:none;color:var(--muted)}
.ib:disabled{opacity:.3;cursor:default}
.btn{border:1px solid rgba(255,255,255,.6);background:var(--glass-strong);box-shadow:var(--edge);border-radius:var(--r-m);padding:9px 16px;font-weight:400;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.btn.lime{background:var(--lime);border-color:var(--lime)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.4;cursor:default}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.6);color:var(--ink);white-space:nowrap;border:0}
.badge.lime{background:var(--lime)}
.badge.warn{background:#FFE3D2;color:#A5431B}
.badge.glass{background:rgba(255,255,255,.55)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.35);border-radius:var(--r-s);padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* En-tête et dock */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.datepill{border-radius:var(--r-m);padding:9px 14px;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 22px}
.pagehead h1{font-size:clamp(44px,7vw,64px);font-weight:200}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:900;display:flex;gap:2px;padding:6px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.42))}
.dock button{border:0;background:none;border-radius:16px;height:46px;min-width:50px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dock button svg{width:20px;height:20px;flex:none}
.dock button span{display:none}
.dock button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:var(--edge),0 4px 14px -6px rgba(0,0,0,.18);padding:0 16px}
.dock button[aria-pressed="true"] span{display:inline}

/* Accueil */
.hero{text-align:left;padding:30px 0 6px}
.hero h1{font-size:clamp(38px,6.4vw,64px);font-weight:200;line-height:1.04}
.seg{display:flex;gap:2px;padding:5px;margin:26px 0 6px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.25));border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge);max-width:640px}
.seg button{flex:1;border:0;background:none;border-radius:13px;padding:11px 6px;font-size:15px;color:var(--muted);white-space:nowrap;position:relative}
.seg button::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:3px;border-radius:2px;background:var(--c);transform:translateX(-50%);opacity:.9}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:var(--edge),0 6px 16px -8px rgba(0,0,0,.25)}
.summary{display:flex;align-items:flex-end;gap:14px;margin:34px 0 14px}
.summary h2{font-size:26px;font-weight:300}
.summary p{margin:0;font-size:14px;color:var(--muted);line-height:1.3}
.summary .dotnum{font-size:46px}
.summary .sep{width:1px;height:40px;background:rgba(23,23,27,.15)}
.summary .muted2{color:var(--faint)}
.wp{border-radius:var(--r-l);padding:16px 18px 14px;min-height:124px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;width:100%;color:var(--ink)}
.wp .lab{font-size:14px;color:var(--muted)}
.wp .val{display:flex;align-items:baseline;gap:4px;margin-top:auto}
.wp .dotnum{font-size:36px}
.wp small{font-size:13px;color:var(--muted)}
.wp .sub{font-size:12px;color:var(--muted)}
.pl{display:block;height:3px;border-radius:2px;background:rgba(23,23,27,.08);overflow:hidden;width:100%}
.pl i{display:block;height:100%;background:var(--c,var(--ink));border-radius:2px}

/* Cartes principales */
.gcard{border-radius:var(--r-xl);padding:24px 26px;position:relative;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.gcard h2{font-size:19px;font-weight:400;margin:0}
.gcard .big{font-size:clamp(52px,9vw,84px)}
.gcard .row small{font-size:16px;color:var(--muted)}
.gcard .arrow{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:var(--r-m);background:var(--ink);color:#fff;display:grid;place-items:center;border:0}
.gcard .arrow svg{width:17px;height:17px}
.gcard p{color:var(--muted)}

/* Chiffres */
.kpi{border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:118px;text-align:left;width:100%}
.kpi .row .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
.kpi .ic svg{width:15px;height:15px}
.kpi .t{font-size:14px;line-height:1.2;color:var(--muted)}
.kpi .v{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.kpi .v b{font-size:28px;font-weight:300;letter-spacing:-.03em;line-height:1}
.kpi .v b small{font-size:14px;color:var(--muted);margin-left:3px}
.spark{width:74px;height:28px;flex:none}

/* Listes */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.list .amt{font-weight:400;white-space:nowrap}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(23,23,27,.25);background:rgba(255,255,255,.5);flex:none;display:grid;place-items:center;padding:0}
.check svg{width:13px;height:13px;opacity:0}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.check[aria-pressed="true"] svg{opacity:1}
.done .grow>span{text-decoration:line-through;color:var(--faint)}
.dtile{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.dtile b{font-size:18px;font-weight:400}
.dtile small{font-size:10px;letter-spacing:.02em;color:var(--muted)}
.dtile.hl{background:var(--lime)}
.ini{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-weight:500;flex:none}
.addline{display:flex;gap:8px;margin-top:14px}
.addline input{flex:1}
.empty{color:var(--muted);font-size:15px;padding:4px 0}
.reco{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.reco:last-child{border-bottom:0}
.reco i{width:3px;align-self:stretch;min-height:18px;border-radius:2px;background:var(--c,var(--orange));flex:none}
.reco p{margin:0;font-size:15px}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.6;margin:0}

/* Formulaires */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.04);border-radius:var(--r-m);padding:11px 14px;color:var(--ink);font-weight:400}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint);font-weight:300}
.bigin{font-family:var(--dot);font-weight:600;font-size:28px;max-width:170px}

/* Health */
.moodcard{border-radius:var(--r-xl);padding:22px 24px;min-height:230px}
.moodcard .mrow{display:flex;gap:2px;margin:16px 0 14px;padding:4px;border-radius:14px;background:rgba(255,255,255,.35);flex-wrap:wrap}
.moodcard .mrow button{flex:1;border:0;background:none;border-radius:11px;padding:8px 6px;font-size:14px;color:var(--muted);white-space:nowrap}
.moodcard .mrow button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--edge)}
.moodcard textarea{margin-top:12px}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter .dotnum{font-size:48px}
.drops{display:flex;gap:4px;margin-top:16px}
.drops span{flex:1;height:6px;border-radius:2px;background:rgba(23,23,27,.08)}
.drops span.on{background:var(--blue)}
.bar{height:4px;border-radius:2px;background:rgba(23,23,27,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--c,var(--ink))}
.minirow{display:flex;gap:4px;align-items:flex-end;height:56px;margin-top:16px}
.minirow span{flex:1;border-radius:4px;background:var(--c);opacity:.85;min-height:3px}
.minirow span.off{background:rgba(23,23,27,.07)}
.mlabels{display:flex;gap:4px;margin-top:6px}
.mlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted)}
.cal button{aspect-ratio:1;border-radius:9px;border:0;background:rgba(255,255,255,.4);font-size:13px;padding:0;display:grid;place-items:center;color:var(--muted)}
.cal button.f{background:color-mix(in srgb,var(--c) 78%,white);color:#fff;font-weight:500}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.cal button.today.f{color:#fff}
.cal button:disabled{opacity:.35}
.cal span.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* Finance */
.catbar{display:flex;align-items:center;gap:10px;margin:10px 0}
.catbar span{width:118px;font-size:14px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbar div{flex:1;height:4px;border-radius:2px;background:rgba(23,23,27,.08);overflow:hidden}
.catbar div i{display:block;height:100%;border-radius:2px;background:var(--c)}
.catbar b{width:78px;text-align:right;font-weight:400;font-size:14px}
.line{width:100%;height:auto;display:block}
.line text{font-size:11px;fill:var(--muted);font-family:"Outfit",sans-serif}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font-weight:400;min-width:140px;text-align:center}
.monthnav b::first-letter{text-transform:uppercase}

/* Progression (certificats, objectifs) */
.prog{display:flex;align-items:center;gap:10px;width:110px;flex:none}
.prog .pl{flex:1}
.prog span{font-size:13px;color:var(--muted);width:34px;text-align:right}
.goalcard{border-radius:var(--r-l);padding:18px;text-align:left;display:flex;flex-direction:column;gap:12px;width:100%;color:var(--ink)}
.goalcard[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,.7));box-shadow:var(--edge),0 22px 44px -22px rgba(70,50,90,.4)}
.goalcard h3{font-size:19px;font-weight:400;line-height:1.2}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:1px;background:rgba(23,23,27,.12)}
.timeline li{display:flex;gap:14px;align-items:flex-start;padding:9px 0;position:relative}
.timeline .grow{flex:1;min-width:0}
.timeline small{display:block;color:var(--muted);font-size:13px}
.timeline li.late small{color:#B4501F}
.timeline li.done .grow>span{text-decoration:line-through;color:var(--faint)}

/* Feuilles */
dialog.sheet{border-radius:var(--r-xl);padding:26px;width:min(520px,94vw);max-height:88vh;color:var(--ink);background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.72))}
dialog.sheet::backdrop{background:rgba(60,50,70,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.sheet h2{font-size:26px;font-weight:300;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.sheetfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.keybox{background:rgba(255,255,255,.6);border-radius:var(--r-s);padding:10px 12px;font-size:14px;word-break:break-all;margin:8px 0;user-select:all;color:var(--ink)}
.login{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:20px}
.login .card{width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;padding:32px 26px}
.login h1{font-size:38px;font-weight:200;margin-bottom:8px}
.login .err{min-height:20px;font-size:14px;color:#A5431B;margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:3000;background:rgba(23,23,27,.88);color:#fff;border-radius:var(--r-m);padding:10px 16px;max-width:92vw;text-align:center;font-size:15px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

@media (max-width:820px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .g2.m1{grid-template-columns:1fr}
  .span2{grid-column:1/-1}
}
@media (max-width:560px){
  .wrap{padding:12px 16px 24px}
  input,select,textarea{font-size:16px!important}
  .card{padding:18px}
  .hero{padding-top:18px}.hero h1{font-size:34px}
  .seg button{font-size:13px;padding:10px 2px}
  .summary{flex-wrap:wrap;gap:10px 14px}.summary>div:first-child{flex-basis:100%}.summary>span[style]{display:none}
  .summary .dotnum{font-size:40px}
  .wp{min-height:112px;padding:14px 16px 12px}.wp .dotnum{font-size:30px}
  .dock button{padding:0 11px;min-width:44px}
  .dock button[aria-pressed="true"]{padding:0 14px}
  .kpi .v b{font-size:24px}
  .catbar span{width:88px}
  .addline{flex-wrap:wrap}.addline #stepIn{flex-basis:100%}
  .card h2{flex-wrap:wrap}
}
/* ===== Accueil façon « aura » ===== */
:root{--serif:"Newsreader","Iowan Old Style",Georgia,serif}
html,#bg{background:#FBF4EF}
#bg i{opacity:.7}
.pagehead h1,.card h2,dialog.sheet h2,.gcard h2,.goalcard h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
.pagehead h1{font-weight:300}
body.home .dock{display:none}

body.home{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.htop{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin:4px 0 0}
.sq{width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.75);background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.45));box-shadow:var(--edge),0 8px 24px -14px rgba(90,60,60,.3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:grid;place-items:center;color:var(--ink);padding:0;font-family:var(--serif);font-size:19px}
.sq svg{width:21px;height:21px;stroke-width:1.3}
.tabs{display:flex;justify-content:center;gap:28px}
.tabs button{border:0;background:none;font-family:var(--serif);font-size:21px;color:#8E8792;padding:6px 0}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.blobwrap{display:grid;place-items:center;height:min(44vh,380px);min-height:260px}
.blob{width:min(260px,62vw);aspect-ratio:1;position:relative;border:0;background:none;padding:0}
.blob i{position:absolute;inset:0;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;background:radial-gradient(circle at 42% 44%,var(--m1) 0%,color-mix(in srgb,var(--m1) 70%,var(--m2)) 45%,color-mix(in srgb,var(--m2) 60%,transparent) 78%);filter:blur(12px);opacity:.85;animation:morph 13s ease-in-out infinite;transition:background 1.2s}
.blob i:last-child{inset:4% 8% 10% 4%;background:radial-gradient(circle at 26% 62%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 70% 30%,color-mix(in srgb,var(--m2) 70%,transparent),transparent 60%);filter:blur(10px);animation-duration:17s;animation-direction:reverse}
@keyframes morph{0%,100%{border-radius:48% 52% 45% 55%/55% 45% 55% 45%;transform:rotate(0) scale(1)}33%{border-radius:60% 40% 55% 45%/45% 60% 40% 55%;transform:rotate(24deg) scale(1.04)}66%{border-radius:42% 58% 40% 60%/58% 42% 58% 42%;transform:rotate(-16deg) scale(.96)}}
@media (prefers-reduced-motion:reduce){.blob i{animation:none}}
.greet{font-family:var(--serif);font-size:clamp(32px,6vw,46px);font-weight:400;text-align:center;letter-spacing:-.015em;line-height:1.1}
.gsub{text-align:center;color:#857E88;margin:16px auto 30px;max-width:34ch;font-size:17px}
.mstrip{display:flex;align-items:center;gap:8px;padding:9px;border-radius:20px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.6);max-width:560px;margin:0 auto 22px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.mt{flex:1;min-width:0;aspect-ratio:1;max-width:86px;border-radius:16px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;color:var(--ink)}
.mt svg{width:42px;height:42px}
.mt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chev{border:0;background:none;color:var(--muted);padding:6px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-height:128px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.75);box-shadow:var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink)}
.tile svg{width:26px;height:26px;stroke-width:1.2}
.tile small{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.tile b{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
.askbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(640px,calc(100% - 28px));display:flex;gap:10px;z-index:900}
.askbar .sq{width:56px;height:56px;border-radius:20px;flex:none;background:linear-gradient(160deg,rgba(236,228,252,.95),rgba(255,255,255,.7))}
.askin{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px 0 20px;border-radius:20px;border:1.5px solid #CBB9EE;background:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.6));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 12px 30px -16px rgba(90,60,120,.35)}
.askin input{border:0!important;background:none!important;box-shadow:none!important;padding:15px 0!important;font-size:17px}
.askin input::placeholder{color:#9A93A0}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.7);background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.32));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);text-align:left;color:var(--ink)}
.hrow .grow{flex:1;min-width:0}
.hrow b{font-family:var(--serif);font-weight:400;font-size:18px;display:block}
.hrow small{display:block;color:var(--muted);font-size:13px}
.hrow em{display:block;font-style:normal;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow>svg{color:var(--faint);flex:none}
.sw{width:12px;height:34px;border-radius:6px;background:var(--c);flex:none}
.moodopt{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;border:1px solid rgba(23,23,27,.06);background:rgba(255,255,255,.6);font-family:var(--serif);font-size:19px;text-align:left;color:var(--ink)}
.moodopt .sw{height:22px;width:22px;border-radius:7px}
.moodopt[aria-pressed="true"]{border-color:var(--ink)}
@media (max-width:560px){.tabs{gap:18px}.tabs button{font-size:19px}.tile{min-height:108px;padding:13px}.tile b{font-size:17px}.mt svg{width:36px;height:36px}.gsub{font-size:16px}}

.htop-d{display:none}
@media (min-width:761px){
  body.home .wrap{max-width:1040px}
  .htop{display:none}
  .htop-d{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 0}
  .dtitle{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,40px);letter-spacing:-.015em}
  .tabbtn{border:0;background:none;font-family:var(--serif);font-size:21px;color:var(--ink);padding:6px 4px}
  .tabbtn:hover{color:#6E6278}
  .tiles,.hist{max-width:760px;margin-left:auto;margin-right:auto}
}

.hgrid{display:flex;flex-direction:column}
.emos{display:none}
@media (min-width:761px){
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:40px;align-items:center;min-height:calc(100vh - 190px)}
  .hright{order:2;display:flex;flex-direction:column;align-items:center}
  .hleft{order:1}
  .hgrid .greet,.hgrid .gsub{display:none}
  .hgrid .blobwrap{height:auto;min-height:0;margin:0 0 28px}
  .hgrid .blob{width:min(320px,30vw)}
  .emos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}
  .emos .chip{background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.4));border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge);font-size:15px;padding:7px 14px}
  .emos .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hleft .mstrip{max-width:none;margin:0 0 12px}
  .hleft .tiles{max-width:none}
}

/* Navigation des pages : icônes en haut au centre */
.dock{display:none!important}
body:not(.home){padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
.top{position:sticky;top:0;z-index:800;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;margin:-10px 0 8px}
.top .datepill{justify-self:start}
.tnav{display:flex;gap:2px;padding:5px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.45));border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),0 12px 30px -18px rgba(70,50,90,.35)}
.tnav button{border:0;background:none;border-radius:15px;height:42px;min-width:46px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px}
.tnav button svg{width:20px;height:20px;flex:none}
.tnav button span{display:none}
.tnav button:hover{color:var(--ink)}
.tnav button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:var(--edge),0 4px 14px -6px rgba(0,0,0,.18);padding:0 15px}
.tnav button[aria-pressed="true"] span{display:inline}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
@media (max-width:560px){
  .top{grid-template-columns:auto 1fr auto;gap:6px}
  .top .datepill,.top .status{display:none}
  .tnav{grid-column:1/3;justify-self:center}
  .tnav button{min-width:40px;padding:0 9px}
  .tnav button[aria-pressed="true"]{padding:0 11px}
}

@media (min-width:761px){
  .htop-d{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
  .htop-d .dtitle{justify-self:start}
}

.homehead{display:none}
@media (min-width:761px){.homehead{display:flex}.htop-d{padding:10px 0;margin:-10px 0 0}.hgrid{min-height:0;margin-top:4px;align-items:center}.hgrid .hright{margin-top:0}}
.btn.danger{background:#C2412D;color:#fff;border-color:#C2412D;box-shadow:none}

/* ===================== Thème photo et verre (comme la page de lancement) ===================== */
:root{
  --ink:#FFFFFF; --muted:rgba(255,255,255,.66); --faint:rgba(255,255,255,.42); --line:rgba(255,255,255,.14);
  --glass:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  --glass-strong:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.09));
  --edge:inset 0 1px 0 rgba(255,255,255,.28);
  --lift:0 30px 60px -32px rgba(0,0,0,.6);
  --blur:blur(16px) saturate(120%);
  --serif:"Sora","Outfit",system-ui,sans-serif;
  --dot:"Sora","Outfit",system-ui,sans-serif;
}

h1,h2,h3,.pagehead h1,.card h2,dialog.sheet h2,.gcard h2,.goalcard h3,.greet,.dtitle,.tabs button,.tabbtn,.tile b,.hrow b,.moodopt{font-family:"Sora","Outfit",system-ui,sans-serif!important;letter-spacing:-.01em}
.pagehead h1{font-weight:200}
.card h2,.gcard h2,.goalcard h3,.tile b,.hrow b{font-weight:300}
.dotnum{font-weight:200;letter-spacing:-.02em}
/* verre */
.card,.kpi,.wp,.gcard,.moodcard,.goalcard,.datepill,.tile,.hrow,.mstrip,.seg,.tnav,.sq{background:var(--glass)!important;border:1px solid rgba(255,255,255,.22)!important;color:#fff;box-shadow:var(--edge),var(--lift)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.mt{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.16)!important;color:#fff}
.goalcard[aria-pressed="true"]{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.1))!important;border-color:rgba(255,255,255,.5)!important}
/* contrôles */
.ib{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.22)!important;color:#fff;box-shadow:none}
.ib.bare{background:none!important;border:0!important;color:var(--muted)}
.ib.dark,.btn.dark,.gcard .arrow{background:rgba(255,255,255,.92)!important;color:#1B1B1D!important;border-color:transparent!important}
.btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.92)!important;color:#1B1B1D!important;border-color:transparent!important}
.badge{background:rgba(255,255,255,.14);color:#fff}
.badge.lime{background:var(--lime);color:#1B1B1D}
.check{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.check[aria-pressed="true"]{background:#fff;border-color:#fff;color:#1B1B1D}
.seg button,.tnav button,.dock button{color:var(--muted)}
.seg button[aria-pressed="true"],.tnav button[aria-pressed="true"],.moodcard .mrow button[aria-pressed="true"]{background:rgba(255,255,255,.9)!important;color:#1B1B1D!important;box-shadow:none!important}
.moodcard .mrow{background:rgba(255,255,255,.08)}
.moodcard .mrow button{color:var(--muted)}
.tabs button{color:var(--faint)}.tabs button[aria-pressed="true"],.tabbtn{color:#fff}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=month],select,textarea{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.18)!important;color:#fff!important;box-shadow:none!important;color-scheme:dark}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.45)!important}
select option{background:#2B2622;color:#fff}
/* pistes, barres, listes */
.pl,.bar,.catbar div,.drops span,.minirow span.off{background:rgba(255,255,255,.12)!important}
.pl i,.bar i{background:var(--c,#fff)}
.list li,.reco,.timeline::before{border-color:var(--line)}
.timeline::before{background:rgba(255,255,255,.2)}
.dtile,.ini,.kpi .row .ic{background:rgba(255,255,255,.12)!important;color:#fff}
.dtile.hl{background:var(--lime)!important;color:#1B1B1D}
.dtile small,.dtile.hl small{color:inherit;opacity:.75}
.cal button{background:rgba(255,255,255,.08);color:var(--muted)}
.cal button.f{color:#fff}
.cal button.today{box-shadow:inset 0 0 0 1.5px #fff;color:#fff}
.summary .sep{background:rgba(255,255,255,.25)}
.gsub{color:var(--muted)}
.askin{background:var(--glass)!important;border:1px solid rgba(255,255,255,.3)!important}
.askin input::placeholder{color:rgba(255,255,255,.5)!important}
.askbar .sq{background:var(--glass-strong)!important}
.moodopt{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.moodopt[aria-pressed="true"]{border-color:#fff}
.keybox{background:rgba(255,255,255,.1);color:#fff}
.done .grow>span,.timeline li.done .grow>span{color:var(--faint)}
.timeline li.late small{color:#FFB38A}
.badge.warn{background:rgba(255,160,120,.25);color:#FFD2BF}
/* feuilles */
dialog.sheet{background:linear-gradient(180deg,rgba(60,52,46,.82),rgba(38,33,30,.86))!important;color:#fff;border:1px solid rgba(255,255,255,.18)!important;-webkit-backdrop-filter:blur(26px) saturate(130%);backdrop-filter:blur(26px) saturate(130%)}
dialog.sheet::backdrop{background:rgba(10,8,6,.35)}
.toast{background:rgba(255,255,255,.92);color:#1B1B1D}
.login .card{background:linear-gradient(180deg,rgba(60,52,46,.6),rgba(38,33,30,.7))!important}
.line text,.chart text{fill:var(--muted)}
.status{color:var(--faint)}
.emos .chip{background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.22)!important;color:#fff!important;box-shadow:none!important}
.emos .chip[aria-pressed="true"]{background:rgba(255,255,255,.92)!important;color:#1B1B1D!important}
.askin input{background:none!important;border:0!important}

/* Humeurs sous l'aura */
.blob i:first-child{filter:blur(24px);opacity:.92}
.blob i:last-child{opacity:.22}
@media (min-width:761px){.hgrid .blob{width:min(320px,28vw)}.hgrid .blobwrap{margin-bottom:22px}body.home{padding-bottom:150px}}
.emos{display:flex!important;flex-direction:column;gap:6px;width:100%;max-width:380px;margin:0 auto}
.mchip{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;text-align:left;font:inherit;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.mchip i{width:14px;height:14px;border-radius:5px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.mchip span{flex:1;min-width:0;line-height:1.2}
.mchip b{font-weight:400;font-size:15px}
.mchip small{display:block;font-size:12px;color:var(--muted)}
.mchip em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mchip[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#1B1B1D;border-color:transparent}
.mchip[aria-pressed="true"] small,.mchip[aria-pressed="true"] em{color:rgba(27,27,29,.6)}
.mixbar{display:flex;height:4px;border-radius:2px;overflow:hidden;width:100%;max-width:380px;margin:14px auto 0;background:rgba(255,255,255,.12);gap:2px}
.mixbar i{display:block;height:100%}
.mixtxt{max-width:380px;margin:10px auto 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.45}
@media (max-width:760px){.emos{flex-direction:row;gap:6px;margin-top:2px}.mchip{flex:1;flex-direction:column;gap:6px;padding:10px 4px;text-align:center;min-width:0}.mchip small{display:none}.mchip b{font-size:12px}.mchip em{font-size:11px}.hgrid .hright{margin-bottom:22px}.gsub{margin-bottom:18px}}
.moodopt[aria-pressed="true"]{background:rgba(255,255,255,.9)!important;color:#1B1B1D!important;border-color:transparent!important}
.moodopt[aria-pressed="true"] small{color:rgba(27,27,29,.6)!important}

/* Finance façon appli bancaire */
.fhero{text-align:center;padding:34px 0 18px;max-width:640px;margin:0 auto}
.finhead{align-items:center;flex-wrap:nowrap}
.finhead .fmonth{flex:none}
.fmonth{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.fmonth b{font-weight:400;font-size:14px;min-width:120px;text-align:center}
.fsub{margin:0;color:var(--muted);font-size:15px}
.famount{border:0;background:none;color:#fff;padding:0;margin:16px 0 12px;display:inline-flex;align-items:baseline;gap:2px;cursor:pointer}
.fint{font-size:clamp(64px,13vw,92px);font-weight:400;letter-spacing:-.04em;line-height:1}
.fdec{font-size:clamp(26px,5vw,34px);font-weight:400;letter-spacing:-.02em}
.fnote{margin:8px 0 0;font-size:13px;color:var(--muted)}
.factions{display:flex;align-items:center;gap:18px;margin-top:40px;text-align:left}
.fadd{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;font-size:14px}
.fround{width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.fround svg{width:26px;height:26px}
.fbudget{flex:1;min-width:0;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.fbudget span{font-size:14px;color:var(--muted)}.fbudget b{font-weight:400;font-size:15px}
.fbudget small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.opscard{max-width:640px;margin:0 auto;padding:16px 18px 8px}
.opfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.oplist li{padding:0;border-bottom:0}

/* Mélange d'humeurs des derniers jours : part de chaque humeur parmi les jours notés */
const MIX_DAYS=7;
function moodMix(n=MIX_DAYS){
  const days=lastDays(n).map(moodsOf).filter(a=>a.length),tot=days.length,w={};
  days.forEach(a=>a.forEach(v=>w[v]=(w[v]||0)+1/a.length));
  const share=MOODS.map(m=>({m,n:w[m.v]||0,p:tot?(w[m.v]||0)/tot:0}));
  const warm=share.filter(x=>x.m.warm).reduce((a,x)=>a+x.p,0),cold=share.filter(x=>x.m.v<=2).reduce((a,x)=>a+x.p,0),tired=share[2].p;
  let verdict;
  if(!tot)verdict="Touche l'aura pour noter ton humeur : elle prendra la couleur de tes derniers jours.";
  else if(warm>=.6)verdict="Tout va bien : tes couleurs sont chaudes ces derniers jours.";
  else if(cold>=.5)verdict="Des jours plus difficiles en ce moment. Prends soin de toi, et parles-en à quelqu'un de confiance si ça dure.";
  else if(tired>=.4)verdict="Beaucoup de fatigue ces derniers jours : accorde-toi du repos.";
  else verdict="Un mélange d'émotions ces derniers jours.";
  return {share,tot,warm,cold,verdict};
}

function auraBg(mix){
  const all=mix.share.filter(x=>x.p>0).sort((a,b)=>b.p-a.p);

  let parts=all.slice(0,2);if(all[2]&&Math.abs(all[2].p-all[1].p)<1e-9)parts=all.slice(0,3);
  const tot=parts.reduce((t,x)=>t+x.p,0)||1;parts=parts.map(x=>({...x,p:x.p/tot}));
  if(!parts.length)return "radial-gradient(circle at 40% 42%,#FFC08F 0%,#FFA5AE 46%,rgba(249,132,153,.45) 70%,transparent 80%)";
  const pos=parts.length===1?[[48,48]]:parts.length===2?[[40,44],[64,60]]:[[42,40],[66,52],[40,68]];
  return parts.map((x,i)=>{const [px,py]=pos[i],sz=Math.round(48+44*x.p);return `radial-gradient(circle at ${px}% ${py}%,${x.m.c} 0%,${x.m.c} ${Math.round(sz*.42)}%,${x.m.c2}99 ${Math.round(sz*.7)}%,transparent ${sz}%)`}).join(",");
}

/* ============ Cache, enregistrement, chargement ============ */
const CACHE="vie2-cache";
function cacheSave(){try{localStorage.setItem(CACHE,JSON.stringify({days:S.days,items:S.items,prefs:S.prefs,dead:S.dead||[],sc:S.studyCerts||[]}))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem(CACHE)||"{}");S.days=c.days||{};S.items=c.items||{};S.prefs=c.prefs||{};S.dead=c.dead||[];S.studyCerts=c.sc||[]}catch(e){}}
let statusT=null;function setStatus(t){const el=$("#status");if(el)el.textContent=t;S.status=t}
const queue={};let qTimer=null;
function patch(day,obj){S.days[day]={...D(day),...obj};queue[day]={...(queue[day]||{}),...obj};cacheSave();setStatus("Enregistrement…");clearTimeout(qTimer);qTimer=setTimeout(flushQueue,600)}
async function flushQueue(){
  let fail=false;
  for(const d of Object.keys(queue)){const p=queue[d];delete queue[d];const {error}=await sb.rpc("vie_save",{p_day:d,p_patch:p});if(error){fail=true;queue[d]={...p,...(queue[d]||{})}}}
  if(fail){setStatus("Hors connexion");clearTimeout(qTimer);qTimer=setTimeout(flushQueue,8000)}else setStatus("Enregistré");
}
async function saveItem(id,data){S.items[id]=data;cacheSave();setStatus("Enregistrement…");
  const {error}=await sb.from("vie_items").upsert({user_id:S.uid,id,kind:data.kind,data,updated_at:new Date().toISOString()});
  setStatus(error?"Non enregistré : vérifie ta connexion":"Enregistré");if(error)toast("Enregistrement impossible : as-tu lancé le script SQL ?")}
async function delItem(id){delete S.items[id];S.dead=[...(S.dead||[]).filter(x=>x!==id),id].slice(-500);cacheSave();const {error}=await sb.from("vie_items").delete().eq("user_id",S.uid).eq("id",id);if(error)toast("Suppression impossible pour le moment.")}
let prefTimer=null;
function savePrefs(obj){S.prefs={...S.prefs,...obj};cacheSave();clearTimeout(prefTimer);
  prefTimer=setTimeout(async()=>{const {error}=await sb.from("vie_prefs").upsert({user_id:S.uid,data:S.prefs,updated_at:new Date().toISOString()});setStatus(error?"Préférences non enregistrées":"Enregistré")},400)}
async function loadAll(){
  const days={};let from=0;
  for(;;){const {data,error}=await sb.from("vie_days").select("day,data").range(from,from+999);if(error)throw error;for(const r of data)days[r.day]=r.data||{};if(data.length<1000)break;from+=1000}
  for(const [d,p] of Object.entries(queue))days[d]={...(days[d]||{}),...p};
  const its={};from=0;
  for(;;){const {data,error}=await sb.from("vie_items").select("id,data").range(from,from+999);if(error)throw error;for(const r of data)its[r.id]=r.data;if(data.length<1000)break;from+=1000}
  const {data:pr,error:pe}=await sb.from("vie_prefs").select("data").maybeSingle();if(pe)throw pe;
  /* Certificats suivis dans Study (table docs, en lecture seule) : Career les affiche sans double saisie */
  try{const {data:sc}=await sb.from("docs").select("data").eq("id","certs").maybeSingle();if(sc&&sc.data&&Array.isArray(sc.data.items))S.studyCerts=sc.data.items}catch(e){}
  /* Ne jamais perdre ce qui est sur l'appareil : tout ce qui manque dans Supabase est gardé puis renvoyé */
  const dead=new Set(S.dead||[]),pushItems=[],pushDays={};
  for(const [id,x] of Object.entries(S.items||{}))if(!its[id]&&!dead.has(id)&&x&&x.kind){its[id]=x;pushItems.push(id)}
  for(const [d,x] of Object.entries(S.days||{})){if(!x||typeof x!=="object")continue;const r=days[d]||{},miss={};for(const k of Object.keys(x))if(!(k in r)&&x[k]!=null)miss[k]=x[k];if(Object.keys(miss).length){days[d]={...r,...miss};pushDays[d]=miss}}
  const localPrefs=S.prefs&&Object.keys(S.prefs).length?S.prefs:null;
  S.days=days;S.items=its;
  if(pr&&pr.data)S.prefs={...(localPrefs||{}),...pr.data};
  cacheSave();render(true);
  let fail=false;
  if(pushItems.length){const rows=pushItems.map(id=>({user_id:S.uid,id,kind:its[id].kind,data:its[id],updated_at:new Date().toISOString()}));const {error}=await sb.from("vie_items").upsert(rows);if(error)fail=true}
  for(const [d,p] of Object.entries(pushDays)){const {error}=await sb.rpc("vie_save",{p_day:d,p_patch:p});if(error)fail=true}
  if((!pr||!pr.data)&&localPrefs){const {error}=await sb.from("vie_prefs").upsert({user_id:S.uid,data:S.prefs,updated_at:new Date().toISOString()});if(error)fail=true}
  if(pushItems.length||Object.keys(pushDays).length)toast(fail?"Certaines données de cet appareil n'ont pas encore pu être sauvegardées : nouvel essai au prochain chargement.":"Les données gardées sur cet appareil ont été sauvegardées.");
  setStatus(fail?"Sauvegarde incomplète":"Synchronisé");
}

/* ============ Claude (fonction "claude" de ton projet Supabase) ============ */
async function callClaude(prompt,max=900){
  const {data:{session}}=await sb.auth.getSession();if(!session)throw {m:"Reconnecte-toi pour utiliser Claude."};
  let r;try{r=await fetch(SUPA_URL+"/functions/v1/claude",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPA_KEY},body:JSON.stringify({messages:[{role:"user",content:prompt}],max_tokens:max})})}catch(e){throw {m:"Pas de connexion : réessaie quand tu es en ligne."}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {m:r.status===429||r.status===529?"Claude est très sollicité : réessaie dans une minute.":"Claude n'a pas pu répondre ("+((j.error&&(j.error.message||j.error))||r.status)+")."};
  const t=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();if(!t)throw {m:"Réponse vide : réessaie."};return t;
}
async function callClaudeJSON(prompt,max){const t=await callClaude(prompt+"\n\nRéponds uniquement avec du JSON valide, sans texte autour ni balises de code.",max);
  const c=t.replace(/```json|```/g,"").trim(),a=c.indexOf("{"),b=c.lastIndexOf("}");if(a<0||b<a)throw {m:"Réponse illisible : réessaie."};return JSON.parse(c.slice(a,b+1))}

/* ============ Calculs : santé, cycle, finances ============ */
const isFlow=f=>f&&f!=="spotting";
function cycleAt(ref){
  const p=P(),fd=Object.keys(S.days).filter(d=>isFlow(S.days[d].flow)).sort(),starts=[],lens=[];let prev=null,rs=null;
  for(const d of fd){if(!prev||diff(prev,d)>3){if(rs)lens.push(diff(rs,prev)+1);starts.push(d);rs=d}prev=d}
  /* Stérilet hormonal : seuls les cycles commencés depuis la pose servent aux estimations */
  const iud=p.iud||null,since=d=>!iud||d>=iud;

  const cl=cyc.length?Math.round(avg(cyc.slice(-6))):p.cycleLen,pl=pls.length?Math.round(avg(pls.slice(-6))):p.periodLen;
  const unsure=!!iud&&cyc.length<2;
  const st=starts.filter(d=>d<=ref);if(!st.length)return {known:false,cl,pl,iud,unsure};
  const last=st[st.length-1],day=diff(last,ref)+1,ovu=cl-14;
  let ph=isFlow(D(ref).flow)||day<=pl?"regles":day>cl+7?null:Math.abs(day-ovu)<=1?"ovu":day<ovu?"folli":"lut";
  return {known:true,last,day,phase:ph,next:addDays(last,cl),cl,pl,iud,unsure};
}

/* Montant d'une ligne récurrente pour un mois : montant propre au mois, sinon montant habituel dans la période */
function amtFor(x,m){if(x.months&&x.months[m]!=null)return +x.months[m];if((x.from&&m<x.from)||(x.to&&m>x.to))return 0;return +x.amount||0}

function moneyBase(m){
  const exp=items("exp").filter(x=>(x.date||"").startsWith(m));
  const fix=items("fix").map(x=>({...x,amount:amtFor(x,m)})).filter(x=>x.amount>0);
  const inc=items("inc").filter(x=>x.rec!=="Ponctuel"||(x.date||"").startsWith(m)).map(x=>x.rec==="Ponctuel"?x:{...x,amount:amtFor(x,m)}).filter(x=>(+x.amount||0)>0);

function money(m){

}

  if(mm.I>0&&avail>0&&mm.V>avail*(dn/dim)*1.15)r.push({c:"#A8C3D1",t:`Tes dépenses variables vont plus vite que prévu : ${eur(mm.V)} dépensés, il te reste ${eur(Math.max(0,avail-mm.V))} pour ${dim-dn+1} jours.`});
  for(const e of items("event"))if(e.date===addDays(t,1))r.push({c:"#F3D9A6",t:`Demain : ${e.title}. Prépare ton pitch et deux questions à poser.`});
  const late=[];for(const g of items("goal"))for(const s of g.steps||[])if(!s.done&&s.date&&s.date<t)late.push(s.text);
  if(late.length)r.push({c:"#FFC08F",t:late.length===1?`Étape en retard dans tes objectifs : ${late[0]}.`:`${late.length} étapes de tes objectifs sont en retard. Choisis-en une à faire aujourd'hui.`});

  return n<0?"en retard, c'était pour le "+fmtShort(x.due):n===0?"à faire aujourd'hui au plus tard":n===1?"jusqu'à demain":`jusqu'au ${fmtShort(x.due)}, encore ${n} jours`;

function cycleCard(d){
  const t=today(),x=D(d),ci=cycleAt(d),cl=ci.cl,pl=Math.max(1,Math.min(ci.pl,cl-3)),ovu=cl-14,R=52,C=2*Math.PI*R,GAP=4;
  const oa=Math.max(pl+1,ovu-1),ob=Math.max(oa,ovu+1);
  const segs=[["regles",1,pl],["folli",pl+1,oa-1],["ovu",oa,ob],["lut",ob+1,cl]].filter(([,a,b])=>a<=b);
  const late=ci.known&&ci.day>cl,cur=ci.known&&!ci.unsure?(late?null:ci.phase):null;
  const arcs=segs.map(([k,a,b])=>{const len=Math.max(1,(b-a+1)/cl*C-GAP);return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PH[k].c}" stroke-width="${cur===k?12:8}" stroke-opacity="${!ci.known||ci.unsure?.3:cur===k?1:.45}" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-((a-1)/cl*C+GAP/2)).toFixed(1)}" style="filter:drop-shadow(0 0 ${cur===k?7:4}px ${PH[k].c})"/>`}).join("");
  let dot="";if(ci.known){const dc=Math.min(cl,Math.max(1,ci.day)),an=(dc-.5)/cl*2*Math.PI-Math.PI/2;dot=`<circle cx="${(70+R*Math.cos(an)).toFixed(1)}" cy="${(70+R*Math.sin(an)).toFixed(1)}" r="7.5" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`}
  const src=(x.src||{}).flow==="sante"?`<span class="badge">Santé</span>`:"";
  const leg=segs.map(([k,a,b])=>`<span class="${cur===k?"on":""}"><i style="--c:${PH[k].c}"></i>${cap(PH[k].n)}<small>J${a}${b>a?"–"+b:""}</small></span>`).join("");
  const nx=ci.known?diff(t,ci.next):null;
  const sel=(k,list,lab)=>`<label class="fld" style="margin:0">${lab}<select class="daysel" data-k="${k}" data-day="${d}">${list.map(([v,l])=>`<option value="${v}"${(x[k]||"")===v?" selected":""}>${l}</option>`).join("")}</select></label>`;
  const when=d===t?"aujourd'hui":"ce jour-là";
  const est=ci.known?(nx>0?`Prochaines règles estimées vers le ${fmtShort(ci.next)}, dans ${nx} jour${nx>1?"s":""}.`:nx===0?"Tes règles sont attendues aujourd'hui.":`Tes règles étaient attendues vers le ${fmtShort(ci.next)}.`):"Note le premier jour de tes règles, ou laisse le raccourci les importer depuis Clue via Santé.";
  const iudTxt=ci.iud?`<p style="margin:16px 0 0">Stérilet hormonal posé le ${parseISO(ci.iud).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}).replace(/^1 /,"1er ")}. ${diff(ci.iud,t)<183?"Les premiers mois, des saignements irréguliers et du spotting sont fréquents.":"Avec le temps, les règles deviennent souvent plus légères, plus espacées, ou s'arrêtent."}</p>`:"";
  const estTxt=ci.unsure?"Pas encore assez de cycles depuis la pose pour estimer tes prochaines règles. Note tes saignements et tes douleurs : l'estimation s'affinera.":ci.iud&&ci.known?est+" Estimation peu fiable avec un stérilet hormonal.":est;
  return `<section class="card"><h2>Cycle ${src}<small>${ci.unsure?"cycle en évolution":cl+" jours en moyenne"}</small></h2>
    <div class="cyc">
      <div class="cring" role="img" aria-label="${ci.known?`Jour ${ci.day} du cycle${late?", règles attendues":ci.phase?", "+PH[ci.phase].n:""}`:"Cycle : pas encore de données"}">
        <svg viewBox="0 0 140 140" aria-hidden="true"><g transform="rotate(-90 70 70)">${arcs}</g>${dot}</svg>
        <div class="cmid">${ci.known?`<small>jour</small><b>${ci.day}</b><small>${ci.unsure?"depuis tes règles":late?"règles attendues":ci.phase?PH[ci.phase].n:""}</small>`:`<b>–</b><small>pas encore de données</small>`}</div>
      </div>
      <div class="cyc-leg">${leg}</div>
    </div>
    ${iudTxt}
    <p style="margin:${ci.iud?8:16}px 0 12px">${estTxt}</p>
    <div class="grid g2" style="gap:10px">${sel("flow",FLOWS,"Règles "+when)}${sel("pain",PAINS,"Douleurs "+when)}</div>
    <p class="hint" style="margin-top:12px">Estimations à partir de tes cycles passés, sans valeur médicale ni contraceptive.${ci.iud?" Si des douleurs fortes ou des saignements abondants durent, parles-en à ta sage-femme ou à ton médecin.":""}</p></section>`;
}

/* Opérations du mois : variables à leur date, fixes au jour de prélèvement, revenus à leur date (ou le 1er) */
function monthOps(m){
  const mm=money(m),t=today(),dim=daysIn(m),ops=[];
  const at=day=>m+"-"+pad(Math.min(dim,Math.max(1,+day||1)));
  const when=d=>(d===t?"Aujourd'hui":d===addDays(t,-1)?"Hier":fmtShort(d))+(d>t?" · prévu":"");
  mm.exp.forEach(e=>ops.push({kind:"exp",id:e.id,date:e.date||at(1),label:e.label||e.cat||"Dépense",tag:e.cat,amount:+e.amount||0,sign:-1,icon:ICO.cart,color:catColor(e.cat||"Autre",EXPCATS)}));
  mm.fix.forEach(e=>ops.push({kind:"fix",id:e.id,date:at(e.day),label:e.label,tag:"Fixe · "+(e.cat||""),amount:+e.amount||0,sign:-1,icon:ICO.lock,color:"#DA9BC0"}));
  mm.inc.forEach(e=>ops.push({kind:"inc",id:e.id,date:e.rec==="Ponctuel"&&e.date?e.date:at(e.day),label:e.label,tag:"Revenu",amount:+e.amount||0,sign:1,icon:ICO.in,color:"#A8C3D1"}));
  ops.forEach(o=>o.when=when(o.date));
  return ops.sort((a,b)=>b.date.localeCompare(a.date)||(b.sign-a.sign));
}

/* Certificats : ceux de Study (avancement calculé d'après les cours cochés là-bas) remplacent les fiches du même nom saisies ici */
const normW=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>2);
const sameCert=(a,b)=>{const x=normW(a),y=normW(b);return x.length>0&&y.length>0&&(x.every(w=>y.includes(w))||y.every(w=>x.includes(w)))};
function certList(){
  const mine=items("cert"),used=new Set();
  const st=(S.studyCerts||[]).filter(c=>c&&c.title).map(c=>{const cs=c.courses||[],tot=sum(cs.map(x=>+x.h||0)),dn=sum(cs.filter(x=>x.done).map(x=>+x.h||0)),n=cs.filter(x=>x.done).length;
    const m=mine.find(x=>!used.has(x.id)&&sameCert(x.name,c.title));if(m)used.add(m.id);
    const [name,org]=String(c.title).split(/\s+[–-]\s+/);
    return {study:true,title:c.title,name,org:org||"",progress:tot?Math.round(dn/tot*100):cs.length?Math.round(n/cs.length*100):0,n,total:cs.length,dn,tot,deadline:(m&&m.deadline)||null}});
  return [...st,...mine.filter(x=>!used.has(x.id))].sort((a,b)=>(+a.progress||0)-(+b.progress||0));
}

const HLINKS={"Sommeil":"sleep","Pas":"steps","Eau":"water","Journal":"journal","Sport":"sport","Aucune dépense":"nospend"};
const HPRESETS=[
  {name:"Dormir 8 h",link:"Sommeil",target:8},
  {name:"Marcher 10 000 pas",link:"Pas",target:10000},
  {name:"Écrire dans mon journal",link:"Journal"},
  {name:"Ne rien dépenser",link:"Aucune dépense"},
  {name:"Sport",link:HWEEK,target:4},
  {name:"Boire assez d'eau",link:"Eau"}];
const habits=()=>items("habit").sort((a,b)=>(a.from||"").localeCompare(b.from||"")||String(a.name).localeCompare(String(b.name)));
const weekSport=d=>{const m=mondayOf(d);return sum(Array.from({length:7},(_,i)=>(D(addDays(m,i)).sport||[]).length))};
function habitState(h,d){
  const x=D(d),p=P(),k=HLINKS[h.link],g=+h.target>0?+h.target:null,fr=n=>(+n||0).toLocaleString("fr-FR");
  if(k==="sleep"){const o=g||p.sleep;return {auto:true,done:(x.sleep||0)>=o,info:`${x.sleep!=null?num(x.sleep,2):"–"} / ${num(o,2)} h de sommeil`}}
  if(k==="steps"){const o=g||p.steps;return {auto:true,done:(x.steps||0)>=o,info:`${x.steps!=null?fr(x.steps):"–"} / ${fr(o)} pas`}}
  if(k==="water"){const o=g||p.water;return {auto:true,done:(x.water||0)>=o,info:`${x.water||0} / ${o} verres`}}
  if(k==="journal"){const ok=!!(x.journal||"").trim();return {auto:true,done:ok,info:ok?"page du journal écrite":"journal pas encore écrit"}}
  if(k==="sport"){const o=g||4,n=weekSport(d);return {auto:true,done:n>=o,info:`${n} / ${o} séance${o>1?"s":""} cette semaine`}}
  if(k==="nospend"){const n=items("exp").filter(e=>e.date===d).length;return {auto:true,done:n===0,info:n?`${n} dépense${n>1?"s":""} notée${n>1?"s":""}`:"aucune dépense notée"}}
  const ck=(x.habits||[]).includes(h.id);
  /* À cocher à la main, tant de jours par semaine (lundi à dimanche) : une fois le compte atteint, c'est fait pour toute la semaine */
  if(h.link===HWEEK){const o=g||4,m=mondayOf(d),n=sum(Array.from({length:7},(_,i)=>(D(addDays(m,i)).habits||[]).includes(h.id)?1:0));return {auto:false,checked:ck,done:ck||n>=o,info:`${n} / ${o} jour${o>1?"s":""} cette semaine${n>=o?", objectif atteint":""}`}}
  /* À cocher à la main, avec un objectif libre : le chiffre suivi de l'unité choisie (20 pages, 30 minutes…) */
  return {auto:false,checked:ck,done:ck,info:g?`objectif : ${fr(g)}${h.unit?" "+esc(h.unit):""}`:""};
}
/* Part des habitudes réalisées un jour donné (null si aucune habitude n'existait ce jour-là) */
function habitScore(d,hs=habits()){const l=hs.filter(h=>(h.from||"")<=d);if(!l.length)return null;const n=l.filter(h=>habitState(h,d).done).length;return {n,total:l.length,p:n/l.length}}
function habitCal(sel){
  const m=S.hbmonth,f=parseISO(m+"-01"),lead=(f.getDay()+6)%7,n=daysIn(m),t=today(),hs=habits();
  let h=["L","M","M","J","V","S","D"].map(w=>`<span class="wd">${w}</span>`).join("");
  for(let i=0;i<lead;i++)h+=`<span class="out"></span>`;
  for(let i=1;i<=n;i++){const d=m+"-"+pad(i),sc=d<=t?habitScore(d,hs):null,pc=sc?Math.round(sc.p*100):null;
    h+=`<button class="${d===t?"today":""}${d===sel?" sel":""}${pc===100?" full":""}" style="--p:${sc?sc.p:0}" data-act="hbday" data-d="${d}"${d>t?" disabled":""} aria-label="${fmtLong(d)}${sc?`, ${pc} % des habitudes`:""}"><span>${i}</span>${sc?`<b>${pc}%</b>`:""}</button>`}
  return `<div class="cal hcal">${h}</div>`;
}
/* Récap de l'accueil : les habitudes du jour qui restent à faire, à cocher sans quitter la page */
function habitHomeCard(){
  const t=today(),hs=habits().filter(h=>(h.from||"")<=t),sc=habitScore(t,hs);
  const rows=hs.map(h=>[h,habitState(h,t)]).filter(([,s])=>!s.done).map(([h,s])=>`<li>${s.auto?`<span class="check" role="img" aria-pressed="false" aria-label="Pas encore fait">${ICO.check}</span>`:`<button class="check" data-act="hbcheck" data-id="${h.id}" aria-pressed="false" aria-label="Cocher ${esc(h.name)}">${ICO.check}</button>`}
    <span class="grow"><span>${esc(h.name)}</span>${s.info?`<small>${s.info}</small>`:""}</span>${s.auto?`<span class="badge">auto</span>`:""}</li>`).join("");
  return `<section class="card todocard habcard"><h2><span>Habitudes du jour</span><span class="row" style="gap:8px">${sc?`<small>${sc.n}/${sc.total}, ${Math.round(sc.p*100)} %</small>`:""}<button class="ib sm" data-view="habits" aria-label="Ouvrir Habits">${ICO.right}</button></span></h2>
    ${!hs.length?`<p class="empty">Aucune habitude pour l'instant. Touche la flèche pour en créer.</p>`:rows?`<ul class="list todolist hlist">${rows}</ul>`:`<p class="empty">Toutes tes habitudes du jour sont faites, bravo !</p>`}</section>`;
}
function habitsPage(){
  const t=today(),d=S.hbday&&S.hbday<=t?S.hbday:t,hs=habits(),l=hs.filter(h=>(h.from||"")<=d),sc=habitScore(d,hs),pc=sc?Math.round(sc.p*100):0,R=26,C=2*Math.PI*R;
  const rows=l.map(h=>{const s=habitState(h,d);return `<li class="${s.done?"done":""}">${s.auto?`<span class="check" role="img" aria-pressed="${s.done}" aria-label="${s.done?"Fait":"Pas encore fait"}">${ICO.check}</span>`:`<button class="check" data-act="hbcheck" data-id="${h.id}" aria-pressed="${s.checked}" aria-label="${s.checked?"Décocher":"Cocher"} ${esc(h.name)}">${ICO.check}</button>`}
    <span class="grow"><span>${esc(h.name)}</span>${s.info?`<small>${s.info}</small>`:""}</span>${s.auto?`<span class="badge">auto</span>`:""}<button class="ib sm bare" data-act="edit" data-kind="habit" data-id="${h.id}" aria-label="Modifier ${esc(h.name)}">${ICO.edit}</button></li>`}).join("");
  const have=new Set(hs.map(h=>h.name)),ideas=HPRESETS.map((x,i)=>have.has(x.name)?"":`<button class="chip" data-act="hbpreset" data-v="${i}">${ICO.plus}${x.name}</button>`).join("");
  const ring=`<span class="hring" role="img" aria-label="${pc} % des habitudes réalisées"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="6"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="#A8C3D1" stroke-width="6" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #A8C3D1)" stroke-dasharray="${(C*pc/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><b>${pc}%</b></span>`;
  const later=hs.length-l.length;
  return `<div class="pagehead"><div><h1>Habits</h1><p>Tes habitudes, jour après jour</p></div></div>
  <div class="grid g2 m1">
    <section class="card"><h2><span>${d===t?"Aujourd'hui":cap(fmtLong(d))}</span><button class="ib sm" data-act="new" data-kind="habit" aria-label="Ajouter une habitude">${ICO.plus}</button></h2>
      ${l.length?`<div class="hsum">${ring}<p>${sc.n} habitude${sc.n>1?"s":""} sur ${sc.total} ${d===t?"aujourd'hui":"ce jour-là"}.${sc.n===sc.total?" Bravo !":""}</p></div>
      <ul class="list todolist hlist">${rows}</ul>`:`<p class="empty">${later?"Tes habitudes n'existaient pas encore ce jour-là.":"Aucune habitude pour l'instant. Choisis une idée ci-dessous ou touche + pour créer la tienne."}</p>`}
      ${ideas&&d===t?`<p class="hint" style="margin:16px 0 8px">Idées, cochées toutes seules par l'app</p><div class="chips">${ideas}</div>`:""}</section>
    <section class="card"><h2>Mon mois <span class="monthnav"><button class="ib sm" data-act="hbprev" aria-label="Mois précédent">${ICO.left}</button><button class="ib sm" data-act="hbnext" aria-label="Mois suivant"${S.hbmonth>=monthOf(t)?" disabled":""}>${ICO.right}</button></span></h2><p class="muted" style="margin:-8px 0 12px;text-transform:capitalize">${monthLabel(S.hbmonth)}</p>${habitCal(d)}
      <p class="hint" style="margin-top:14px">Chaque case indique la part de tes habitudes réalisées ce jour-là. Touche un jour pour le voir ou le corriger.</p></section>
  </div>`;
}

/* Dictée : la voix est transcrite en texte par le navigateur et ajoutée à la page du jour */
function dictUI(interim){const b=$("#dictBtn"),h=$("#dictHint"),on=!!S.dict;
  if(b){b.classList.toggle("dark",on);b.setAttribute("aria-pressed",on);b.lastElementChild.textContent=on?"Arrêter":"Dicter"}
  if(h){h.hidden=!on;h.textContent=interim||"Je t'écoute…"}}
function dictStop(){if(S.dict)try{S.dict.rec.stop()}catch(e){}}
function dictToggle(){
  if(S.dict){dictStop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("La dictée n'est pas disponible dans ce navigateur. Essaie avec Safari ou Chrome.");return}
  const rec=new SR(),day=S.day;rec.lang="fr-FR";rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    const el=$("#journal");if(!el||el.dataset.day!==day){dictStop();return}
    let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}
    fin=fin.trim();
    if(fin){const cur=el.value,fresh=!cur.trim()||/[.!?…\n]\s*$/.test(cur);el.value=cur+(cur&&!/\s$/.test(cur)?" ":"")+(fresh?cap(fin):fin);patch(day,{journal:el.value});el.scrollTop=el.scrollHeight}
    dictUI(tmp.trim());
  };
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Autorise le micro pour ce site dans les réglages du navigateur.");else if(e.error==="audio-capture")toast("Aucun micro détecté.");else if(e.error==="network")toast("La dictée a besoin d'une connexion internet.")};
  rec.onend=()=>{if(S.dict&&S.dict.rec===rec)S.dict=null;dictUI()};
  try{rec.start();S.dict={rec,day};dictUI()}catch(e){toast("Impossible de démarrer la dictée.")}
}
/* Mise au propre et recommandations : le texte du jour n'est envoyé à Claude que sur demande */
async function journalClean(){
  dictStop();const day=S.day,src=D(day).journal||"";
  if(src.trim().length<20){toast("Écris ou dicte d'abord quelques phrases.");return}
  const prompt=`Voici une page de journal intime, dictée à voix haute puis transcrite automatiquement.\n\nMets-la au propre : corrige les erreurs de transcription, l'orthographe et la grammaire, ajoute la ponctuation et les majuscules, retire les hésitations et les répétitions involontaires, et découpe le texte en paragraphes, un par idée, séparés par une ligne vide.\nGarde la première personne, ses mots, son ton et toutes ses idées : ne résume pas, n'ajoute rien, ne commente pas.\n\nTexte :\n<<<\n${src}\n>>>\n\nFormat : {"texte":"..."}`;
  S.busy.jclean=true;render();
  try{const j=await callClaudeJSON(prompt,Math.min(4000,Math.round(src.length/2)+600));const out=typeof j.texte==="string"?j.texte.trim():"";
    if(!out||out.length<src.trim().length*.5)throw {m:"Réponse incomplète : ton texte n'a pas été modifié. Réessaie."};
    if((D(day).journal||"")!==src)throw {m:"Tu as modifié le texte entre-temps : relance la mise au propre."};
    patch(day,{journal:out,journalRaw:src});toast("Texte mis au propre. « Revenir à mon texte » annule.")}
  catch(e){toast(e.m||"Claude n'a pas pu répondre.")}
  S.busy.jclean=false;render();
}
async function journalRecos(){
  dictStop();const day=S.day,x=D(day),p=P(),src=(x.journal||"").trim();
  if(src.length<20){toast("Écris ou dicte d'abord quelques phrases.");return}
  const prev=Object.keys(S.days).filter(k=>k<day&&(S.days[k].journal||"").trim()).sort().reverse().slice(0,3).reverse().map(k=>`${fmtLong(k)} : ${S.days[k].journal.trim().slice(0,600)}`).join("\n\n");
  const prompt=`Tu es la coach bienveillante de ${p.name||"une jeune femme"}. Profil : ${p.profile}\n\nSa page de journal du ${fmtLong(day)}${moodNames(day)?" (humeur : "+moodNames(day)+")":""} :\n<<<\n${src}\n>>>${prev?"\n\nSes pages précédentes, pour le contexte :\n"+prev:""}\n\nDonne 3 recommandations concrètes et personnelles qui répondent à ce qu'elle exprime dans cette page : ce qui la préoccupe, ce qu'elle veut, ce qui lui fait du bien. Une phrase ou deux chacune, en français, en la tutoyant, sans jugement ni diagnostic médical. Si elle exprime une grande détresse, encourage-la avec douceur à en parler à une personne de confiance ou à un professionnel. Format : {"recos":["...","...","..."]}`;
  S.busy.jreco=true;render();
  try{const j=await callClaudeJSON(prompt,700);const r=(j.recos||[]).filter(k=>typeof k==="string").slice(0,4);if(!r.length)throw {m:"Réponse vide : réessaie."};patch(day,{journalRecos:{items:r,at:new Date().toISOString()}})}
  catch(e){toast(e.m||"Claude n'a pas pu répondre.")}
  S.busy.jreco=false;render();
}
function goalsPage(){

  const cards=gs.map((g,i)=>`<button class="goalcard" data-act="pickgoal" data-id="${g.id}" aria-pressed="${S.goal===g.id}"><span class="row between"><span class="badge${i===0?" lime":""}">${esc(g.cat||"Perso")}</span>${ringSVG(prog(g),["#FFC08F","#FFA5AE","#ABB2F0","#A8C3D1","#BDB0EE"][i%5])}</span><h3>${esc(g.title)}</h3><span class="hint" style="margin:0">${g.deadline?(diff(t,g.deadline)>=0?`${diff(t,g.deadline)} jours restants`:"échéance passée"):"sans échéance"}, ${(g.steps||[]).filter(s=>s.done).length}/${(g.steps||[]).length} étapes</span></button>`).join("");

    const tl=steps.length?`<ul class="timeline">${steps.map(s=>`<li class="${s.done?"done":s.date&&s.date<t?"late":""}"><button class="check" data-act="step" data-id="${g.id}" data-sid="${s.id}" aria-pressed="${!!s.done}" aria-label="Étape faite">${ICO.check}</button><span class="grow"><span>${esc(s.text)}</span><small>${s.date?fmtLong(s.date)+(s.date<t&&!s.done?", en retard":""):"sans date"}</small></span><button class="ib sm bare" data-act="delstep" data-id="${g.id}" data-sid="${s.id}" aria-label="Supprimer l'étape">${ICO.trash}</button></li>`).join("")}</ul>`:`<p class="empty">Pas encore d'étapes. Ajoute-les une par une, ou laisse Claude préparer un rétroplanning.</p>`;

      <div style="margin-top:16px"><div class="row" style="align-items:flex-end;gap:8px"><span class="dotnum big">${Math.round(prog(g)*100)}</span><small>% accompli</small></div>
      ${g.deadline?`<p style="margin:6px 0 0;opacity:.92">Échéance le ${fmtLong(g.deadline)}</p>`:""}${g.why?`<p style="margin:8px 0 0;opacity:.92">${esc(g.why)}</p>`:""}</div></section>
    <div class="grid g2 m1"><section class="card"><h2>Rétroplanning <button class="btn" data-act="plan"${S.busy.plan?" disabled":""}>${ICO.spark}${S.busy.plan?"Claude prépare…":steps.length?"Refaire avec Claude":"Créer avec Claude"}</button></h2>${tl}
      <div class="addline"><input type="text" id="stepIn" placeholder="Nouvelle étape" aria-label="Nouvelle étape"><input type="date" id="stepDate" aria-label="Date de l'étape" style="max-width:160px"><button class="ib dark" data-act="addstep" data-id="${g.id}" aria-label="Ajouter l'étape">${ICO.plus}</button></div></section>
    <section class="card"><h2>Recos pour cet objectif</h2>${(g.recos||[]).length?g.recos.map(r=>`<div class="reco" style="--c:var(--violet)"><i></i><p>${esc(r)}</p></div>`).join(""):`<p class="empty">Claude te proposera des conseils en créant le rétroplanning.</p>`}</section></div>`;
  }
  return `<div class="pagehead"><div><h1>Goals</h1><p>Tes objectifs, étape par étape</p></div><button class="btn dark" data-act="new" data-kind="goal">${ICO.plus}Objectif</button></div>
  ${gs.length?`<div class="grid g3" style="margin-bottom:14px">${cards}</div>${detail}`:`<section class="card"><p class="empty">Ajoute ton premier objectif, par exemple « Être admise à l'ESSEC Global BBA » ou « Mettre 1 000 € de côté ». Claude t'aidera à le découper en étapes datées.</p><button class="btn dark" data-act="new" data-kind="goal" style="margin-top:8px">${ICO.plus}Ajouter un objectif</button></section>`}`;
}
async function planClaude(id){
  const g=S.items[id],p=P(),t=today();if(!g)return;
  const done=(g.steps||[]).filter(s=>s.done).map(s=>s.text).join(" ; ")||"aucune";
  const prompt=`Profil : ${p.profile}\nObjectif : ${g.title}\nDomaine : ${g.cat||"Perso"}\nPourquoi : ${g.why||"non précisé"}\nÉchéance : ${g.deadline||"à définir, propose une échéance réaliste"}\nAujourd'hui : ${t}\nÉtapes déjà faites : ${done}\n\nConstruis un rétroplanning réaliste de 5 à 8 étapes pour atteindre cet objectif, en partant de l'échéance et en remontant jusqu'à aujourd'hui. Chaque étape est une action concrète avec une date au format AAAA-MM-JJ, comprise entre aujourd'hui et l'échéance, dans l'ordre chronologique. Ne répète pas les étapes déjà faites. Ajoute 3 conseils courts pour réussir. Tout en français, en la tutoyant. Format : {"steps":[{"text":"...","date":"AAAA-MM-JJ"}],"recos":["...","...","..."]}`;
  S.busy.plan=true;render();
  try{const j=await callClaudeJSON(prompt,1400);
    const ns=(j.steps||[]).filter(s=>s&&s.text).map(s=>({id:uid(),text:String(s.text),date:/^\d{4}-\d{2}-\d{2}$/.test(s.date||"")?s.date:"",done:false}));
    if(!ns.length)throw {m:"Claude n'a pas proposé d'étapes : réessaie."};
    const kept=(g.steps||[]).filter(s=>s.done);
    await saveItem(id,{...S.items[id],steps:[...kept,...ns],recos:(j.recos||[]).filter(r=>typeof r==="string").slice(0,4)});
  }catch(e){toast(e.m||"Claude n'a pas pu répondre.")}
  S.busy.plan=false;render();
}

  event:{t:"Événement pro",f:[["title","Titre","text"],["type","Type","chips",EVKINDS],["date","Date","date"],["time","Heure","time"],["place","Lieu","text"],["notes","Notes","textarea"]]},
  cert:{t:"Certificat",f:[["name","Nom","text"],["org","Organisme","text"],["progress","Avancement en %","number"],["deadline","Date visée","date"]]},
  contact:{t:"Contact",f:[["name","Nom","text"],["company","Entreprise","text"],["role","Poste","text"],["met","Rencontré(e) où","text"],["next","Prochaine relance","date"],["link","Lien LinkedIn","text"],["notes","Notes","textarea"]]},
  habit:{t:"Habitude",f:[["name","Nom de l'habitude","text"],["link","Cochée par","chips",[HMANUAL,HWEEK,...Object.keys(HLINKS)]],["target","Objectif chiffré, facultatif (heures, pas, verres, jours ou séances par semaine)","number"],["unit","Unité de ton objectif, pour une habitude cochée à la main (pages, minutes, km, fois…)","text"]]},
  goal:{t:"Objectif",f:[["title","Objectif","text"],["cat","Domaine","chips",GOALCATS],["deadline","Échéance","date"],["why","Pourquoi c'est important pour toi","textarea"]]}
};
const DEFAULTS={exp:()=>({date:today(),cat:"Courses"}),fix:()=>({cat:"Abonnements",day:1}),inc:()=>({rec:"Chaque mois",date:today()}),event:()=>({date:today(),type:"Afterwork"}),cert:()=>({progress:0}),contact:()=>({}),goal:()=>({cat:"Carrière"}),habit:()=>({link:HMANUAL,from:today()})};
function openSheet(kind,id){S.panel=null;
  const F=FORMS[kind],x=id?S.items[id]:DEFAULTS[kind]();S.sheet={kind,id,vals:{...x}};
  $("#sheet").innerHTML=`<h2>${id?"Modifier":"Nouveau"} : ${F.t.toLowerCase()}</h2>${F.f.map(([k,l,type,opts])=>{const v=x[k]??"";
    if(type==="chips")return `<div class="fld">${l}<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-sheetchip="${k}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join("")}</div></div>`;
    if(type==="textarea")return `<label class="fld">${l}<textarea data-f="${k}">${esc(v)}</textarea></label>`;
    return `<label class="fld">${l}<input data-f="${k}" type="${type==="money"?"number":type}"${type==="money"?' inputmode="decimal" step="0.01" min="0"':type==="number"?' inputmode="numeric"':""} value="${esc(v)}"></label>`}).join("")}
    <div class="sheetfoot">${id?`<button class="btn ghost" data-sheet="del">${ICO.trash}Supprimer</button>`:"<span></span>"}<span class="row"><button class="btn" data-sheet="cancel">Annuler</button><button class="btn dark" data-sheet="save">Enregistrer</button></span></div>`;
  if(!$("#sheet").open)$("#sheet").showModal();const first=$("#sheet input[data-f]");if(first&&!id)setTimeout(()=>first.focus(),50);
}
async function saveSheet(){
  const {kind,id}=S.sheet,F=FORMS[kind],v={...S.sheet.vals};
  $("#sheet").querySelectorAll("[data-f]").forEach(el=>v[el.dataset.f]=el.value.trim());
  for(const [k,,type] of F.f)if((type==="money"||type==="number")&&v[k]!==""&&v[k]!=null)v[k]=+String(v[k]).replace(",",".");
  const main=F.f[0][0];if(v[main]===""||v[main]==null||(F.f[0][2]==="money"&&!(v[main]>0))){toast("Remplis d'abord « "+F.f[0][1]+" ».");return}
  if(kind==="cert")v.progress=Math.max(0,Math.min(100,+v.progress||0));
  $("#sheet").close();await saveItem(id||uid(),{...v,kind});render();
}

/* ============ Préférences ============ */
function settingsHTML(){const p=P();
  return `<h2>Préférences</h2>
  <label class="fld">Prénom<input data-pref="name" type="text" value="${esc(p.name)}" placeholder="Marine"></label>
  <label class="fld">Ton profil (utilisé par Claude pour ses recos)<textarea data-pref="profile">${esc(p.profile)}</textarea></label>
  <div class="grid g2" style="gap:10px">
    <label class="fld">Verres d'eau par jour<input data-pref="water" type="number" min="1" value="${p.water}"></label>
    <label class="fld">Taille d'un verre (ml)<input data-pref="glass" type="number" min="50" step="50" value="${p.glass}"></label>
    <label class="fld">Pas par jour<input data-pref="steps" type="number" min="500" step="500" value="${p.steps}"></label>
    <label class="fld">Heures de sommeil<input data-pref="sleep" type="number" min="4" step="0.5" value="${p.sleep}"></label>
    <label class="fld">Minutes de sport par semaine<input data-pref="sportWeek" type="number" min="10" step="10" value="${p.sportWeek}"></label>
    <label class="fld">Durée du cycle (jours)<input data-pref="cycleLen" type="number" min="15" max="60" value="${p.cycleLen}"></label></div>
  <label class="fld">Stérilet hormonal posé le (laisse vide si tu n'en as pas)<input data-pref="iud" type="date" max="${today()}" value="${esc(p.iud||"")}"></label>
  <div class="fld" style="margin-top:6px">Raccourci Santé
    ${S.newKey?`<span>Copie ta clé maintenant, elle ne sera plus affichée :</span><div class="keybox">${esc(S.newKey)}</div><button class="btn" data-act="copykey">Copier la clé</button>`:`<span>Crée une clé privée pour que ton raccourci iPhone envoie tes pas, ton sommeil et tes règles. Une nouvelle clé remplace l'ancienne.</span><button class="btn" data-act="newkey" style="align-self:flex-start">Créer ma clé</button>`}
    <span>Adresse du raccourci :</span><div class="keybox">${SUPA_URL}/rest/v1/rpc/vie_import</div></div>
  <div class="sheetfoot"><button class="btn ghost" data-act="logout">Se déconnecter</button><button class="btn dark" data-sheet="cancel">Fermer</button></div>`}
async function newKey(){
  const bytes=crypto.getRandomValues(new Uint8Array(24)),k="vie_"+btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(k)))].map(b=>b.toString(16).padStart(2,"0")).join("");
  const {error}=await sb.from("vie_tokens").upsert({user_id:S.uid,token_hash:h,created_at:new Date().toISOString()});
  if(error){toast("La clé n'a pas pu être créée : as-tu lancé le script SQL ?");return}
  S.newKey=k;$("#sheet").innerHTML=settingsHTML();
}

/* ============ Interactions ============ */
let toastT=null;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}
function addTodo(){const el=$("#todoIn");const v=el&&el.value.trim();if(!v)return;const du=$("#todoDue");saveItem(uid(),{kind:"todo",text:v,date:today(),due:(du&&du.value)||today(),done:false});el.value="";render();setTimeout(()=>{const i=$("#todoIn");if(i)i.focus()},30)}
function addSport(){const min=+($("#sportMin").value||0),ty=$("#sportType").value,it=$("#sportInt").value;if(!(min>0)){toast("Indique la durée en minutes.");return}
  S.stype=ty;S.sint=it;S.sportAdd=false;patch(S.day,{sport:[...(D(S.day).sport||[]),{type:ty,min:Math.round(min),int:it}]});render()}
function addStep(id){const tx=$("#stepIn").value.trim(),dt=$("#stepDate").value;if(!tx)return;const g=S.items[id];saveItem(id,{...g,steps:[...(g.steps||[]),{id:uid(),text:tx,date:dt,done:false}]});render()}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.view){if($("#sheet").open){S.panel=null;$("#sheet").close()}S.pop=b.classList.contains("flowerbtn");S.view=b.dataset.view;S.gsub=null;S.hbday=null;if(S.view!=="health")S.day=today();render();window.scrollTo({top:0});return}
  if(b.dataset.sheetchip){const k=b.dataset.sheetchip;S.sheet.vals[k]=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(b.dataset.sheet){const a=b.dataset.sheet;if(a==="cancel")$("#sheet").close();else if(a==="save")saveSheet();else if(a==="del"){if(!b.dataset.armed){b.dataset.armed="1";b.classList.add("danger");b.innerHTML=ICO.trash+"Confirmer la suppression";setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.classList.remove("danger");b.innerHTML=ICO.trash+"Supprimer"}},4000)}else{const id=S.sheet.id;$("#sheet").close();delItem(id).then(()=>{render();toast("Supprimé.")})}}return}
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,d=S.view==="health"?S.day:today();if(!a)return;
  if(a==="water")setWater(d,(D(d).water||0)+(+v));
  else if(a==="waterset"){const w=D(d).water||0;setWater(d,w===+v?+v-1:+v)}
  else if(a==="sportadd"){S.sportAdd=!S.sportAdd;render();if(S.sportAdd)setTimeout(()=>{const i=$("#sportMin");if(i)i.focus()},30)}
  else if(a==="addsport")addSport();
  else if(a==="delsport"){const s=[...(D(d).sport||[])];s.splice(+b.dataset.i,1);patch(d,{sport:s});render()}
  else if(a==="dayprev"){S.day=addDays(S.day,-1);render()}
  else if(a==="daynext"){if(S.day<today())S.day=addDays(S.day,1);render()}
  else if(a==="openday"){S.day=b.dataset.d;S.view="health";render();window.scrollTo({top:0})}
