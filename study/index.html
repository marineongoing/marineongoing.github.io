header.top h1,header.top p,.subtabs button,.tab[aria-selected="false"],.goalstrip .hint,.weekbar h2,.weekbar .hint,.topbar .status{text-shadow:0 1px 3px rgba(20,24,22,.45)}
.panel,.sheet,.day,.upcoming,.study,.tool,.extra,.cert,.today-col,.goalstrip,nav.views,.search input,.tab[aria-selected="true"],.semtoggle,.empty{-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(150%);backdrop-filter:blur(var(--blur,20px)) saturate(150%);box-shadow:0 8px 28px rgba(15,22,18,.22),inset 0 1px 0 rgba(255,255,255,.12)}
dialog{background:rgba(26,33,29,.72)!important;-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.2)!important;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.qres{background:rgba(26,33,29,.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
select option,select optgroup{background:#26302B;color:#F7F5F2}
input::placeholder,textarea::placeholder{color:rgba(247,245,242,.55)}
.subtabs{border-bottom-color:rgba(247,243,241,.35)}
h1,h2,h3{font-family:var(--hfont,"Sora","Outfit",system-ui,sans-serif);margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar nav.views{order:2;margin-left:auto}.topbar .status{order:1}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.02em}
header.top p{margin:4px 0 0;color:var(--muted)}
nav.views{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
nav.views button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
nav.views .homebtn{padding:2px 10px;display:grid;place-items:center}
nav.views .homebtn img{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .15s}
nav.views .homebtn:hover img{transform:scale(1.08) rotate(-6deg)}
nav.views .homebtn[aria-pressed="true"]{background:rgba(255,255,255,.2)}
nav.views button[aria-pressed="true"]{background:var(--ink);color:#2F3431}
.search{position:relative;order:1;flex:1;max-width:360px;margin-left:16px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.qres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:20;max-height:60vh;overflow:auto;padding:6px}
.qres button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;border-left:4px solid var(--c)}
.qres button:hover{background:var(--bg)}
.qres small{display:block;color:var(--muted);font-size:12px}
.qres mark{background:#F9C6D6;color:#2B2A27}
.today-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.today-col h2{font-size:19px;margin-bottom:8px}
@media (max-width:900px){.today-grid{grid-template-columns:1fr}.search{order:3;max-width:none;margin:0;flex-basis:100%}}
.failbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#5E2F42;color:#FFE9EF;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.status{font-size:13px;color:var(--muted);min-height:18px}

/* Binder layout: subject tabs on the side */
.binder{display:grid;grid-template-columns:230px 1fr;gap:0;align-items:start}
.tabs{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.tab{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-right:0;background:var(--paper);padding:10px 12px;border-radius:12px 0 0 12px;margin-right:-1px;position:relative;font-weight:500;font-size:14px;line-height:1.25}
.tab .tn{display:flex;flex-direction:column}
.tab .tn small{font-size:12px;color:var(--muted);font-weight:400}
.tab .pinicon{flex:none;width:10px;display:grid;place-items:center;color:var(--muted);margin-right:0}
.tabsep{height:1px;background:var(--line);margin:4px 12px 4px 0}
.tab .dot{flex:none;width:10px;height:28px;border-radius:4px;background:var(--c)}
.tab[aria-selected="true"]{font-weight:600;z-index:2;box-shadow:inset 4px 0 0 var(--c)}
.tab[aria-selected="false"]{background:transparent;border-color:transparent;color:#F1ECEA}
.tab[aria-selected="false"]:hover{background:var(--paper);color:var(--ink)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:0 16px 16px 16px;padding:22px;min-height:520px;border-top:6px solid var(--c)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sheet-head h2{font-size:26px}
.linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted)}
.linkrow a{color:var(--accent);font-weight:600}
.notes-layout{display:grid;grid-template-columns:240px 1fr;gap:18px}
.notelist{display:flex;flex-direction:column;gap:4px;max-height:560px;overflow:auto}
.notelist button{border:1px solid transparent;background:none;text-align:left;padding:9px 10px;border-radius:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:6px}
.ccard{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);width:100%}
.ccard:hover{border-color:var(--c)}
.ccard.pin{color:var(--ink)}

/* ===== Accueil façon aura ===== */
.dash-h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.aura-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 22px;margin-bottom:10px}
.aura{position:relative;width:min(300px,62vw);aspect-ratio:1;margin:6px auto 18px}
.aura i{position:absolute;inset:0;border-radius:58% 42% 50% 50%/52% 48% 52% 48%;filter:blur(22px) saturate(1.25);opacity:.95}
.aura i:first-child{background:radial-gradient(circle at 36% 42%,var(--a1) 0%,var(--a1) 38%,transparent 72%);animation:auraA 14s ease-in-out infinite}
.aura i:last-child{background:radial-gradient(circle at 66% 56%,var(--a2) 0%,var(--a2) 36%,transparent 72%);animation:auraB 17s ease-in-out infinite}

<dialog id="stDialog">

function applyDocs(docs){
  const notes={};let events=state.events,links=state.links;
  // ignore stale copies of documents we changed more recently on this page
  const skip=new Set(Object.keys(docs).filter(id=>revs[id]&&((docs[id]&&docs[id]._rev)||0)<revs[id]));
  for(const id of skip){if(id.startsWith("n-")&&state.notes[id])notes[id]=state.notes[id];delete docs[id]}
  for(const id in revs){if(id.startsWith("n-")&&!(id in docs)&&state.notes[id]&&Date.now()-revs[id]<15000)notes[id]=state.notes[id]}
  if(docs.settings&&docs.settings.years)state.semesters=docs.settings.years;
  if(docs.studies)state.studies=Array.isArray(docs.studies.items)?docs.studies.items:[];
  if(docs.alternance)state.alt={info:docs.alternance.info||state.alt.info,missions:Array.isArray(docs.alternance.missions)?docs.alternance.missions:[]};
  if(docs.grades){state.grades=Array.isArray(docs.grades.items)?docs.grades.items:[];state.goals=docs.grades.goals||{}}
  if(docs.prefs){state.prefs=docs.prefs;applyPrefs()}
  if(docs.bg){state.bgImg=docs.bg.img||"";applyPrefs()}
  if(docs.bilans)state.bilans=Array.isArray(docs.bilans.items)?docs.bilans.items:[];
  if(docs.veille)state.veille=Array.isArray(docs.veille.items)?docs.veille.items:[];
  if(docs.orals)state.orals=Array.isArray(docs.orals.items)?docs.orals.items:[];
  for(const k in docs)if(k.startsWith("v-"))state.versions[k.slice(2)]=Array.isArray(docs[k].versions)?docs[k].versions:[];
  if(docs.toeic)state.toeic={goal:docs.toeic.goal||780,scores:Array.isArray(docs.toeic.scores)?docs.toeic.scores:[]};
  if(docs.tools)state.tools=Array.isArray(docs.tools.items)?docs.tools.items:[];
  if(docs.certs)state.certs=Array.isArray(docs.certs.items)?docs.certs.items:[];
  if(docs.extras)state.extras=Array.isArray(docs.extras.items)?docs.extras.items:[];
  const hasParts=Object.keys(docs).some(k=>k.startsWith("cal-"))||Object.keys(calParts).length;
  for(const [id,d] of Object.entries(docs)){
    if(id.startsWith("cal-"))calParts[id]=Array.isArray(d.events)?d.events:[];
    else if(id==="calendar"){if(!hasParts){legacyCal=Array.isArray(d.events)?d.events:[]}}
    else if(id==="subjects")links=d.links||{};
    else if(id.startsWith("n-"))notes[id]=d;
  }
  // keep the note being edited if it has unsaved local changes
  if(state.noteId&&dirty.has(state.noteId)&&state.notes[state.noteId])notes[state.noteId]=state.notes[state.noteId];
  if(Object.keys(calParts).length)events=Object.values(calParts).flat();else if(legacyCal)events=legacyCal;
  state.events=events;state.links=links;state.notes=notes;
}

const OBK="bts-ndrc-outbox";
function obRead(){try{return JSON.parse(localStorage.getItem(OBK)||"{}")}catch(e){return {}}}
function obWrite(o){try{localStorage.setItem(OBK,JSON.stringify(o))}catch(e){}}
function obPut(id,d){const o=obRead();o[id]=d;obWrite(o)}
function obDel(id,rev){const o=obRead();if(o[id]&&(!rev||(o[id]._rev||0)<=rev)){delete o[id];obWrite(o)}}
function replayOutbox(srv){const o=obRead();let n=0;for(const [id,d] of Object.entries(o)){const sv=srv&&srv[id];if(sv&&(sv._rev||0)>=(d._rev||0)){obDel(id);continue}
  const c=JSON.parse(JSON.stringify(d));if(id.startsWith("n-")){state.notes[id]=c}n++;persist(id,c)}if(n){render();toast(n+" modification"+(n>1?"s":"")+" non envoyée"+(n>1?"s":"")+" récupérée"+(n>1?"s":"")+" et synchronisée"+(n>1?"s":"")+".")}}
async function persist(id,data){
  if(!store)return;
  data._rev=Date.now();revs[id]=data._rev;if(!id.startsWith("v-"))obPut(id,data);
  if(writing[id]){pending[id]=data;return}
  writing[id]=true;setStatus("Enregistrement…");
  try{await store.saveDoc(id,data);obDel(id,data._rev);delete failed[id];setStatus("Enregistré");if(!Object.keys(failed).length)hideFail()}
  catch(e){failed[id]=data;showFail(e&&e.code==="quota_exceeded"?"Espace de stockage plein : supprime d'anciennes notes ou fichiers.":"Une modification n'a pas pu être enregistrée.")}
  writing[id]=false;
  if(pending[id]){const p=pending[id];delete pending[id];persist(id,p)}else if(id===state.noteId)dirty.delete(id);
}
async function remove(id){if(store){try{await store.deleteDoc(id)}catch(e){setStatus("Suppression impossible pour le moment.")}}}

function courseStats(k){
  const S=state.semesters[k],t=iso(new Date());let d=parseISO(S.start);const end=parseISO(S.end);
  const tot={},done={};let T=0,D=0;
  while(d<=end){const wd=d.getDay();
    if(wd>=1&&wd<=5){const ds=iso(d);for(const e of eventsOn(d)){if(e.type!=="cours")continue;
      const h=hoursOf(e);T+=h;tot[e.subject]=(tot[e.subject]||0)+h;
      const past=ds<t||(ds===t&&e.end&&e.end<=new Date().toTimeString().slice(0,5));
      if(past){D+=h;done[e.subject]=(done[e.subject]||0)+h}}}
    d=addDays(d,1)}
  return {T,D,tot,done};
}
function hoursOf(e){if(e.start&&e.end){const [a,b]=e.start.split(":").map(Number),[c,d]=e.end.split(":").map(Number);const h=(c*60+d-a*60-b)/60;if(h>0)return h}return 7}
const fmtH=h=>(Math.round(h*10)/10).toString().replace(".",",")+" h";
function donut(pct){
  const r=52,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="donut" viewBox="0 0 130 130" role="img" aria-label="${pct} % des cours effectués">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--bg)" stroke-width="14"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"${pct===0?' opacity="0"':''}/>
    <text x="65" y="72" text-anchor="middle" font-size="26" font-weight="700">${pct} %</text></svg>`;
}

function renderWeek(){
  const ws=state.weekStart,we=addDays(ws,4),today=iso(new Date());

    <h2>Semaine du ${fmtDay(ws)} au ${we.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</h2>
    <div class="toolbar">

      <button class="btn primary" data-act="add">Ajouter</button>
    </div></div><div class="week-scroll"><div class="week">`;
  for(let i=0;i<5;i++){
    const day=addDays(ws,i),evs=eventsOn(day);
    html+=`<div class="day${iso(day)===today?" today":""}"><h3>${DAYS[i]} <span>${fmtDay(day)}</span></h3>`;
    for(const e of evs){
      const s=SUBJ[e.subject]||SUBJECTS[0];

      html+=`<button class="ev ${e.type}" style="--c:${s.c}" data-ev="${e.id}" data-on="${iso(day)}">
        <small>${TYPE_LABEL[e.type]}${time?" · "+time:""}</small><b>${esc(e.title||s.name)}</b>${e.title?`<small>${esc(s.name)}</small>`:""}</button>`;
    }

  }
  html+=`</div></div><div class="legend"><span><i style="background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4))"></i>Cours</span><span><i style="background:var(--devoir)"></i>Devoir à rendre</span><span><i style="background:var(--examen)"></i>Examen</span></div>`;
  // upcoming deadlines (next 21 days)

  $("#view-week").innerHTML=html;
}

function noteVisible(n,sid){return n&&n.subject===sid&&(n.pin||!state.sem||!n.date||inSem(n.date,state.sem))}
function courseSessions(sid){const out=[];if(!state.sem)return out;const S=state.semesters[state.sem];let d=parseISO(S.start);const end=parseISO(S.end);
  while(d<=end){if(d.getDay()>=1&&d.getDay()<=5){const ds=iso(d);
    const evs=eventsOn(d).filter(e=>e.type==="cours"&&e.subject===sid);
    if(evs.length){const key=dayNoteKey(sid,ds,evs);
      const starts=evs.map(e=>e.start).filter(Boolean).sort(),ends=evs.map(e=>e.end).filter(Boolean).sort();
      const titles=[...new Set(evs.map(e=>e.title).filter(Boolean))];

  return out}
function notesOf(sid){return Object.entries(state.notes).filter(([,n])=>!n.pin&&!n.evKey&&n.subject===sid&&(!state.sem||!n.date||inSem(n.date,state.sem))).sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||"")||(b[1].updatedAt||0)-(a[1].updatedAt||0))}

  const done=ss.filter(has).length,past=ss.filter(c=>c.date<=t);

function cleanHtml(html){const t=document.createElement("template");t.innerHTML=html||"";const out=document.createElement("div");
  const map={h1:"h2",h2:"h2",h3:"h3",h4:"h3",p:"p",div:"p",ul:"ul",ol:"ul",li:"li",br:"br",strong:"b",b:"b",em:"i",i:"i",u:"u",hr:"hr"};
  const walk=(src,dst)=>{for(const n of [...src.childNodes]){
    if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));continue}
    if(n.nodeType!==1)continue;const tag=n.tagName.toLowerCase();
    if(tag==="span"||tag==="mark"||tag==="font"){const c=HL[((n.style&&n.style.backgroundColor)||"").toLowerCase()];
      if(c){const sp=document.createElement("span");sp.style.backgroundColor=c;walk(n,sp);dst.appendChild(sp)}else walk(n,dst);continue}
    const m=map[tag];if(!m){walk(n,dst);continue}
    const el=document.createElement(m);if(m!=="br"&&m!=="hr")walk(n,el);dst.appendChild(el)}};
  walk(t.content,out);return out.innerHTML}
function noteHtml(n){if(n.html)return cleanHtml(n.html);return n.content?cleanHtml(md(n.content)):""}
function htmlText(h){const d=document.createElement("div");d.innerHTML=h;d.querySelectorAll("p,h2,h3,li,br").forEach(x=>x.append("\n"));return d.textContent.replace(/\n{3,}/g,"\n\n").trim()}

function hlSpan(node){while(node&&node.id!=="rte"){if(node.nodeType===1&&node.tagName==="SPAN"&&node.style.backgroundColor)return node;node=node.parentNode}return null}
function highlight(color){const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);if(r.collapsed)return;
  const root=$("#rte");if(!root.contains(r.commonAncestorContainer))return;
  // collect text nodes in range
  const walker=document.createTreeWalker(r.commonAncestorContainer.nodeType===3?r.commonAncestorContainer.parentNode:r.commonAncestorContainer,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode()){const t=walker.currentNode;if(r.intersectsNode(t)&&t.nodeValue.length)nodes.push(t)}
  let first=null,last=null;
  for(let t of nodes){let s0=t===r.startContainer?r.startOffset:0,e0=t===r.endContainer?r.endOffset:t.nodeValue.length;if(e0<=s0)continue;
    if(e0<t.nodeValue.length)t.splitText(e0);if(s0>0)t=t.splitText(s0);
    const old=hlSpan(t.parentNode);
    if(old){ // split existing highlight span around t
      const before=old.cloneNode(false),after=old.cloneNode(false);let n=old.firstChild,phase=0;
      while(n){const nx=n.nextSibling;if(n===t||n.contains&&n.contains(t)){phase=1}else if(phase===0)before.appendChild(n);else after.appendChild(n);n=nx}
      const par=old.parentNode;if(before.firstChild)par.insertBefore(before,old);
      const mid=color?Object.assign(document.createElement("span"),{}):null;
      if(mid){mid.style.backgroundColor=color;par.insertBefore(mid,old);mid.appendChild(t)}else par.insertBefore(t,old);
      if(after.firstChild)par.insertBefore(after,old);old.remove();first=first||t;last=t;continue}
    if(color){const sp=document.createElement("span");sp.style.backgroundColor=color;t.parentNode.insertBefore(sp,t);sp.appendChild(t)}
    first=first||t;last=t}
  if(last){const nr=document.createRange();const host=hlSpan(last)||last;nr.setStartAfter(host);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr)}
  root.normalize()}
function rteCmd(k){const el=$("#rte");if(!el)return;el.focus();
  if(k==="h2"||k==="h3"||k==="p"){document.execCommand("formatBlock",false,"<"+k+">")}

  else if(k==="hr"){{const sl=getSelection();if(sl.rangeCount&&!sl.isCollapsed)sl.collapseToEnd()}document.execCommand("insertHorizontalRule");const sel=getSelection();const hrs=el.querySelectorAll("hr");const last=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentNode);
    let hr=null;hrs.forEach(h=>{if(!hr||h.compareDocumentPosition(last||el)&Node.DOCUMENT_POSITION_FOLLOWING)hr=h});
    if(hr&&!hr.nextElementSibling){const pp=document.createElement("p");pp.appendChild(document.createElement("br"));hr.after(pp);const r=document.createRange();r.setStart(pp,0);r.collapse(true);sel.removeAllRanges();sel.addRange(r)}}
  else highlight(k==="hp"?"#F9C6D6":k==="hg"?"#C8EBC9":null)
  rteSave();dirty.add(state.noteId);clearTimeout(tmr);tmr=setTimeout(()=>{saveNote();renderNoteList()},900)}

function pushVersion(id,html,force){if(!html||!htmlText(html).trim())return;const vs=[...(state.versions[id]||[])];const last=vs[vs.length-1];

let sampleFn=null,lastFiche="",busy=false;
async function callClaude(messages,max){const {data:{session}}=await sb.auth.getSession();if(!session)throw {code:"not_granted"};
  let r;try{r=await fetch(SUPA_URL+"/functions/v1/claude",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPA_KEY},body:JSON.stringify({messages,max_tokens:max||3000})})}catch(e){throw {code:"offline"}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:r.status===429||r.status===529?"rate_limited":r.status===403?"not_granted":"error",message:(j.error&&(j.error.message||j.error))||r.status};return j}
async function initClaude(){
  sampleFn=async(input,opts={})=>{const messages=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const j=await callClaude(messages,opts.maxTokens||3500);const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    if(opts.onText)opts.onText({text});return {text,truncated:j.stop_reason==="max_tokens"}};
  sampleFn.json=async(p,o)=>{const r=await sampleFn(p+"\n\nRéponds uniquement avec du JSON valide, sans texte autour ni balises de code.",o);
    const t=r.text.replace(/```json|```/g,"").trim();const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw {code:"empty"};return JSON.parse(t.slice(a,b+1))};
  render();if(noteDlg.open)renderEditor()}

/* ---------- Tiny Markdown renderer (safe) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>")}
function md(src){
  const lines=String(src).split(/\r?\n/);let out="",inList=false,inOl=false;
  const close=()=>{if(inList){out+="</ul>";inList=false}if(inOl){out+="</ol>";inOl=false}};
  for(const raw of lines){
    const l=raw.trimEnd();let m;
    if(m=l.match(/^(#{1,3})\s+(.*)/)){close();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(inOl){out+="</ol>";inOl=false}if(!inList){out+="<ul>";inList=true}out+=`<li>${inline(m[1])}</li>`}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(inList){out+="</ul>";inList=false}if(!inOl){out+="<ol>";inOl=true}out+=`<li>${inline(m[1])}</li>`}
    else if(/^---+$/.test(l.trim())){close();out+="<hr>"}
    else if(!l.trim()){close()}
    else{close();out+=`<p>${inline(l)}</p>`}
  }
  close();return out;
}

function currentCourse(){const now=new Date(),t=iso(now),hm=now.toTimeString().slice(0,5);
  const today=eventsOn(now).filter(e=>e.type==="cours"&&e.subject!=="gen"&&SUBJ[e.subject]);
  let cur=today.find(e=>e.start&&e.start<=hm&&(!e.end||e.end>=hm))||today.filter(e=>e.start&&e.start<=hm).pop()||today[0];
  if(cur)return {sid:cur.subject,ds:t};
  for(let i=1;i<21;i++){const d=addDays(now,-i);const l=eventsOn(d).filter(e=>e.type==="cours"&&e.subject!=="gen"&&SUBJ[e.subject]);if(l.length)return {sid:l[l.length-1].subject,ds:iso(d)}}return null}
